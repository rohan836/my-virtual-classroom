l">Full screen</button></div></header><main id="main"></main><footer><button id="prev">← Previous</button><span id="progress" aria-live="polite"></span><button id="next" class="primary">Next slide →</button></footer></div><dialog id="gloss"><div class="mono meta">WORD EXPLORER</div><h2 id="word"></h2><div id="wordart"></div><p id="meaning"></p><p id="example" class="example"></p><div id="wordlist" hidden></div><div class="row"><button id="allwords">All words</button><button id="close">Close ×</button></div></dialog><script>(function lesson(){
'use strict';
const $=id=>document.getElementById(id);
const vocab={
electricity:['Electricity','Energy and effects associated with electric charge. A battery can transfer energy through a circuit.','A torch uses electrical energy to make light.'],
charge:['Electric charge','A property of tiny particles. Electrons carry negative charge.','Metal wires contain electrons that can move.'],
electron:['Electron','A tiny particle with negative electric charge.','In metal wires electrons drift opposite to conventional current.'],
circuit:['Circuit','A connected path through which current can flow when it is complete.','Battery → resistor → LED → switch → battery.'],
battery:['Battery','A source that uses chemical energy to create a voltage between two terminals.','Four 1.5 V cells in series supply about 6 V when fresh.'],
voltage:['Voltage (V)','Energy transferred per unit of charge; it is like the electrical push between two points.','A fresh AA cell supplies about 1.5 V.'],
V:['Volt (V)','The unit used to measure voltage. In an equation V can also represent voltage.','6 V means six volts.'],
current:['Current (I)','How much electric charge passes a point each second.','More current can make a correctly connected LED brighter, within its rating.'],
I:['I — electric current','The letter used for electric current in equations.','I = 0.02 A is the same as 20 mA.'],
A:['Ampere (A)','The unit of electric current. One ampere is one coulomb of charge per second.','1 A = 1,000 mA.'],
mA:['Milliampere (mA)','One thousandth of an ampere; a convenient unit for small currents.','20 mA = 0.020 A.'],
resistor:['Resistor','A component designed to provide a chosen amount of resistance.','A 220 Ω resistor can limit the current through a small LED.'],
resistance:['Resistance (R)','How strongly a material or component opposes electric current.','With the same voltage across it, a 1,000 Ω resistor carries less current than 220 Ω.'],
R:['R — resistance','The letter R represents resistance in an equation; R1 on a circuit drawing labels a resistor.','R = 220 Ω describes its resistance.'],
ohm:['Ohm (Ω)','The unit of resistance. The Greek letter omega is its symbol.','220 Ω is read as 220 ohms.'],
kohm:['Kilohm (kΩ)','One thousand ohms.','1 kΩ = 1,000 Ω.'],
Mohm:['Megohm (MΩ)','One million ohms.','1 MΩ = 1,000,000 Ω.'],
LED:['LED — light-emitting diode','A component that gives off light when current passes through it in the correct direction.','A red indicator light on a device.'],
diode:['Diode','A component that normally lets current flow mainly in one direction.','An LED is a diode that emits light.'],
polarity:['Polarity','Which end is positive and which is negative. Some parts must be connected the correct way.','A new through-hole LED usually has a longer positive lead and a shorter negative lead.'],
anode:['Anode (+)','The LED terminal that should be at a higher voltage for normal forward current.','Usually the longer lead on a new 5 mm LED.'],
cathode:['Cathode (−)','The LED terminal that should be at a lower voltage for normal forward current.','Usually the shorter lead and the flat edge of the lens.'],
switch:['Switch','A component that joins or separates contacts to complete or break a circuit.','A torch switch opens the circuit to turn it off.'],
series:['Series circuit','Components connected one after another in a single path. The same current passes through them.','A battery, resistor and LED connected in one loop.'],
parallel:['Parallel circuit','Components connected across the same pair of points, creating separate paths.','Two equal resistors in parallel have half the resistance of one.'],
conventional:['Conventional current','The agreed direction of current, from positive to negative through the external circuit.','The blue flow markers represent this direction, not individual electrons.'],
lead:['Lead / terminal','A metal connection that lets a component join a circuit.','The silver wires at both ends of a resistor.'],
core:['Ceramic core','A hard, electrically insulating material that supports the resistive film.','The pale rod inside a carbon-film resistor.'],
film:['Carbon film','A thin resistive layer deposited on the ceramic core.','Current travels along the remaining carbon layer.'],
groove:['Helical groove','A spiral-shaped cut in the resistive film that makes its conducting path longer and narrower.','The pale spiral line shows removed carbon, not a wound wire.'],
cap:['Metal end cap','A conductive metal part joining the resistive film to the leads.','A cap sits at each end of the ceramic rod.'],
coat:['Protective coating','A tough insulating covering that protects the resistor and carries its colored bands.','The beige outer body of a carbon-film resistor.'],
tolerance:['Tolerance','The allowed percentage difference between the marked resistance and its actual value.','220 Ω ±5% means approximately 209–231 Ω.'],
multiplier:['Multiplier','A number used to multiply the digits shown by the color bands.','Brown means ×10 in the multiplier position.'],
ohmslaw:["Ohm’s law","For a resistor with constant resistance, voltage across it equals current through it times resistance.","V = I × R. At 3 V across 300 Ω, I = 0.01 A."],
forward:['Forward voltage (Vf)','The voltage across a conducting LED, which depends on its type, current and temperature.','This simplified red LED uses an approximate 2.0 V drop.'],
power:['Power (P)','How quickly energy is transferred or converted; in a resistor much of it becomes heat.','At 0.01 A through 220 Ω, power is 0.022 W.'],
W:['Watt (W)','The unit of power, equal to one joule per second.','A ¼ W resistor is rated for 0.25 W under specified conditions.'],
rating:['Rating','A limit or operating specification given by the manufacturer.','This model uses a 20 mA LED limit and a 0.25 W resistor limit.'],
multimeter:['Multimeter','A measuring tool for voltage, current and resistance.','Measure a disconnected resistor using the resistance setting.'],
breadboard:['Breadboard','A reusable board with hidden metal connections for building circuits without soldering.','Insert a resistor into two different connected rows.'],
schematic:['Schematic','A simplified circuit drawing that uses standard symbols rather than pictures of components.','A zigzag or rectangle stands for a resistor.'],
short:['Short circuit','An unintended very low-resistance path that can cause excessive current and heating.','Never join a battery’s positive and negative terminals directly.'],
pot:['Potentiometer','An adjustable resistor with three terminals, often used to set a voltage.','A rotary volume or control knob can use one.'],
fixed:['Fixed resistor','A resistor with a nominal resistance that is not intentionally adjustable.','A 220 Ω carbon-film resistor.'],
smd:['Surface-mount resistor','A tiny resistor made to be attached directly to a circuit board.','Small rectangular parts on a phone circuit board.']
};
const T=(key,label)=>'<button type="button" class="term" data-word="'+key+'">'+(label||vocab[key][0])+'</button>';
const words=s=>s.replace(/\[([A-Za-z]+)(?:\|([^\]]+))?\]/g,(_,k,label)=>T(k,label));
const slides=[
['sec-intro','Why does an LED need protection?',3,'circuit',[
['A tiny light, a big problem','A small [LED|LED] turns electrical energy into light. It needs a safe amount of [current|current]. A [resistor|resistor] helps control that amount so the LED can shine without being overloaded.','Think of the little red indicator on a charger. It is not designed to take unlimited current.','What might happen if a small LED receives too much current?','Too much current can heat and damage the LED. The exact failure point depends on the component.'],
['Meet the four parts','A [battery|battery] supplies energy, a [resistor|resistor] limits current, an [LED|LED] gives light and a [switch|switch] opens or closes the path. Together they form a [circuit|circuit].','A torch has a source of energy, a light and a switch.','Why does opening a switch turn a light off?','The path is broken, so steady current cannot flow.']]],
['sec-electricity','Electricity, current and voltage',5,'water',[
['What moves in a wire?','Metal contains movable [electron|electrons]. They carry electric [charge|charge]. When a complete path and a source of [voltage|voltage] are present, they drift through the metal. [electricity|Electricity] includes the transfer of energy in this process.','Imagine water already inside a full pipe. A pump makes it circulate.','Does the battery have to send a brand-new electron all the way to the LED before it lights?','No. Charges are already present throughout the circuit. The electrical effect spreads much faster than individual electrons drift.'],
['What is current?','[current|Current] is how much charge passes a point each second. It is measured in [A|amperes (A)] or [mA|milliamperes (mA)]. 1 A = 1,000 mA.','A pipe carrying more water each second has a greater flow rate.','Which is larger: 10 mA or 0.1 A?','0.1 A = 100 mA, ten times 10 mA.'],
['What is voltage?','[voltage|Voltage] is the energy transferred per unit of charge between two points. We measure it in [V|volts (V)]. More voltage across the same resistor means more current.','A pump creates a pressure difference. Voltage is like that difference, not the water itself.','Is voltage the same as current?','No. Voltage is the difference that can drive current; current measures charge flow. The water analogy helps but is not an exact picture of electrons.']]],
['sec-resistance','Meet the resistor',4,'water',[
['Resistor versus resistance','A [resistor|resistor] is the physical part. [resistance|Resistance] is its property: opposition to current. The symbol [R|R] represents resistance; [ohm|Ω] is its unit.','A narrow pipe opposes water flow more than a wide pipe.','At the same voltage, which allows more current, 100 Ω or 1 kΩ?','100 Ω allows more current. 1 kΩ means 1,000 Ω.'],
['Why does resistance matter?','A [fixed|fixed resistor] controls current and transfers some electrical energy into heat. It does not use up charge. In a [series|series circuit], current is the same everywhere.','Georg Ohm studied how voltage and current relate in the 1820s. The unit ohm is named after him.','Is less current leaving the resistor than entering it?','No. In a single steady loop, the same charge per second passes every component. Energy is transferred, not charge consumed.']]],
['sec-inside','Inside a real carbon-film resistor',4,'resistor',[
['Outside: what you can hold','A common through-hole resistor has two metal [lead|leads], a protective [coat|coating] and colored bands. It has no [polarity|polarity]; either end can face the battery.','A typical quarter-watt axial resistor body is roughly 6 mm long; actual dimensions vary.','Can we connect this resistor backwards?','Yes. An ordinary fixed resistor works in either direction.'],
['Inside: a carefully made path','The [core|ceramic core] supports a thin [film|carbon film]. A [groove|helical groove] is cut into the film to adjust resistance. [cap|Metal end caps] connect the film to the leads.','A longer, narrower conducting path generally gives more resistance for the same material.','Is the spiral a separate coil of wire?','Not in this carbon-film example. It is the remaining film around a spiral cut. Wire-wound resistors are a different type.']]],
['sec-bands','Read the color code',5,'bands',[
['Four bands tell a number','Read from the end with the closer group of bands; the tolerance band is usually separated. The first two bands are digits, the third is the [multiplier|multiplier] and the fourth is [tolerance|tolerance].','Red (2), red (2), brown (×10), gold (±5%) gives 22 × 10 = 220 Ω.','What does brown–black–red–gold mean?','10 × 100 = 1,000 Ω or 1 kΩ, ±5%.'],
['Tolerance and five-band codes','A gold tolerance band means the actual value may differ by up to 5% from the marked value under specified conditions. Five-band resistors use three digits, then multiplier and tolerance.','220 Ω ±5% means 209–231 Ω. A 5-band 220 Ω example is red–red–black–black–brown (±1%).','Do two 220 Ω resistors have to be exactly identical?','No. Their measured values may differ within tolerance. Use a [multimeter|multimeter] on an isolated unpowered resistor to check.']]],
['sec-ohms','Ohm’s law: predict the current',4,'ohm',[
['Three quantities, one relationship','[ohmslaw|Ohm’s law] connects [voltage|voltage], [current|current] and [resistance|resistance]: [V|V] = [I|I] × [R|R]. To find current, divide the voltage across a resistor by its resistance.','3 V ÷ 300 Ω = 0.01 A = 10 mA.','If voltage stays fixed and resistance doubles, what happens?','Current becomes half for an ideal constant resistor.'],
['Voltage across the resistor matters','When a resistor shares a supply with an LED, the LED takes part of the voltage. Use the voltage across the resistor, not automatically the full battery voltage.','For our red LED model: 6 V − 2 V = 4 V across the resistor. 4 V ÷ 220 Ω ≈ 18.2 mA.','Why is 6 ÷ 220 not the LED current in this example?','The LED has its own approximate forward voltage, leaving 4 V across the resistor.']]],
['sec-lab-stage','Build and test an LED safety circuit',5,'circuit',[
['Predict, switch on, observe','Set the supply to 6 V and the [resistor|resistor] to 220 Ω. Close the [switch|switch]. Follow [conventional|conventional current] from + through the resistor and LED and back to −.','Try 1 kΩ: the same loop now carries about 4 mA, so the LED is dimmer.','Will moving the resistor to the other side of the LED change the series current?','No. In the same single loop the current is equal through all parts.'],
['Test a dangerous choice virtually','Choose 10 Ω only in this simulation. The calculated current demand is far above the assumed 20 mA [rating|rating]. The resistor may also exceed its [power|power] rating. Real batteries and LEDs are not ideal, so the result is a warning, not a prediction of exact failure time.','Use “Simulate LED damage” to demonstrate one possible failure: an open LED. Replace it to repair the circuit.','Does switching off magically repair a damaged LED?','No. A damaged component must be replaced. Never deliberately overload real parts.'],
['Polarity and power','A normal LED must face the correct way: [anode|anode (+)] toward the positive side and [cathode|cathode (−)] toward the negative side. Reverse the LED in the virtual lab to see why it will not conduct normally.','A resistor is not directional; an LED is. The resistor’s power is P = I²R, measured in [W|watts].','Why check resistor power as well as LED current?','Resistors turn energy into heat. Too much power can damage the resistor even if it has the correct resistance value.']]],
['sec-circuit','Where resistors are used',3,'uses',[
['Everyday jobs','Resistors protect indicator lights, set currents in electronic boards and help create voltage dividers. A [pot|potentiometer] is adjustable, while a [smd|surface-mount resistor] is a tiny board-mounted part.','An Arduino indicator LED often uses a series resistor. A control knob may use an adjustable resistor.','Is every resistor a beige cylinder?','No. Resistors come in different packages, materials, power ratings and sizes.'],
