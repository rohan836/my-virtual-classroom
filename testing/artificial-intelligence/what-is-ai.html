<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>/ai studies — What Is AI? (Class 5 · Day 1)</title>

  <!-- Crisp Editorial Sans & Technical Monospace Fonts (with instant system fallbacks) -->

  <style>
    /* =========================================================================
       SWISS-EDITORIAL SCIENTIFIC DESIGN SYSTEM (/ai studies · Class 5 · Day 1)
       Pure white #ffffff canvas · #e04836 signal red (rules/errors/active)
       #2563eb signal blue (AI/learning/correct) · #e5e5e5 crisp hairlines
       ========================================================================= */
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --grid: #f3f3f3;
      --ink: #111111;
      --ink-soft: #3a3a40;
      --muted: #666666;
      --faint: #999999;
      --border: #e5e5e5;
      --border-strong: #d4d4d8;
      --red: #e04836;
      --red-soft: #fff5f3;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #15803d;
      --green-soft: #f0fdf4;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --r: 3px;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      user-select: none;
    }

    /* =========================================================================
       1. FIXED VIEWPORT SHELL: TOP (42px) | MAIN (1fr) | BOTTOM (54px)
       ========================================================================= */
    #app {
      display: grid;
      grid-template-rows: 42px 1fr 54px;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }

    /* TOP HAIRLINE BAR */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      font-family: var(--mono);
      font-size: 11px;
      z-index: 30;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      height: 100%;
    }

    .top-cell {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 14px;
      border-right: 1px solid var(--border);
      white-space: nowrap;
    }

    .top-cell:first-child {
      padding-left: 0;
      font-weight: 600;
      color: var(--ink);
    }

    #top-slide-label {
      color: var(--red);
      font-weight: 500;
    }

    #top-rule-label {
      color: var(--muted);
    }

    #top-counter {
      color: var(--muted);
      margin: 0 10px;
      font-weight: 500;
    }

    .nav-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--r);
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--ink);
      background: var(--surface);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* =========================================================================
       2. MAIN 3-COLUMN WORKSPACE: LEFT (336px) | STAGE (1fr) | MONITOR (258px)
       Guarantees zero overlap at 1280x720, 1440x900, and iPad sizes
       ========================================================================= */
    #workspace {
      display: grid;
      grid-template-columns: 336px 1fr 258px;
      min-height: 0;
      overflow: hidden;
      background-color: var(--bg);
      background-image:
        radial-gradient(#e4e4e7 1px, transparent 1px),
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 32px 32px, 32px 32px, 32px 32px;
    }

    /* LEFT EDITORIAL COLUMN */
    #left-panel {
      background: rgba(255, 255, 255, 0.98);
      border-right: 1px solid var(--border);
      padding: 18px 20px 16px 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #left-panel::-webkit-scrollbar,
    #stage::-webkit-scrollbar { width: 5px; }
    #left-panel::-webkit-scrollbar-thumb,
    #stage::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .slide-tag {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--faint);
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .headline {
      margin: 0 0 10px 0;
      line-height: 1.09;
      letter-spacing: -0.025em;
    }

    .headline-l1 {
      display: block;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 26px;
      color: var(--ink);
    }

    .headline-l2 {
      display: block;
      font-family: var(--sans);
      font-style: italic;
      font-weight: 400;
      font-size: 26px;
      color: var(--ink);
      margin-top: 2px;
    }

    .intro-text {
      font-size: 12.5px;
      line-height: 1.52;
      color: var(--ink-soft);
      margin: 0 0 13px 0;
    }

    .hairline {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0 0 13px 0;
    }

    .meta-table {
      display: grid;
      grid-template-columns: 64px 1fr;
      row-gap: 11px;
      column-gap: 10px;
      font-size: 12px;
      line-height: 1.48;
    }

    .meta-k {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--faint);
      padding-top: 1px;
    }

    .meta-k.k-red { color: var(--red); font-weight: 500; }
    .meta-k.k-blue { color: var(--blue); font-weight: 500; }

    .meta-v {
      color: #27272a;
    }

    /* CENTER INTERACTIVE STAGE */
    #stage {
      padding: 18px 22px;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .stage-inner {
      width: 100%;
      max-width: 780px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* RIGHT COLUMN ANCHORING TOP-RIGHT CONCEPT MONITOR CARD (235px) */
    #right-rail {
      padding: 18px 16px 18px 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      overflow-y: auto;
      min-height: 0;
    }

    #monitor-card {
      width: 235px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      flex-shrink: 0;
    }

    .mon-head {
      padding: 8px 11px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mon-live-dot {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--blue);
      font-weight: 600;
    }

    .mon-live-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
    }

    #mon-readout {
      padding: 10px 11px 9px 11px;
      font-family: var(--mono);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mon-canvas-wrap {
      height: 78px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: relative;
    }

    #mon-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #mon-rows {
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
    }

    .mon-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .mon-row .k { color: var(--faint); }
    .mon-row .v { color: var(--ink); font-weight: 500; text-align: right; }

    /* =========================================================================
       3. BOTTOM CONTROL BAR (54px)
       ========================================================================= */
    #bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      z-index: 30;
      gap: 12px;
    }

    .bottom-left, .bottom-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .legend-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--muted);
      margin-right: 6px;
    }

    .leg-item { display: inline-flex; align-items: center; gap: 5px; }
    .leg-dash { width: 11px; height: 2px; display: inline-block; }

    .slide-pill {
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 9px;
      border: 1px solid var(--border-strong);
      border-radius: var(--r);
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.13s ease;
    }

    .slide-pill:hover { border-color: var(--ink); color: var(--ink); }
    .slide-pill.active {
      border-color: var(--red);
      background: var(--red-soft);
      color: var(--red);
      font-weight: 600;
    }

    .sci-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 11px;
      border: 1px solid var(--border-strong);
      border-radius: var(--r);
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
      transition: all 0.13s ease;
      white-space: nowrap;
      line-height: 1.2;
    }

    .sci-btn:hover { border-color: var(--ink); background: var(--surface); }
    .sci-btn.active-red { border-color: var(--red); background: var(--red-soft); color: var(--red); font-weight: 600; }
    .sci-btn.active-blue { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 600; }
    .sci-btn.active-green { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }

    .hint-mono {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--faint);
      white-space: nowrap;
    }

    /* =========================================================================
       SHARED STAGE COMPONENTS & BADGES
       ========================================================================= */
    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 13px 15px;
    }

    .card-soft {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 11px 14px;
    }

    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.04em;
      padding: 3px 7px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-weight: 500;
    }

    .badge.red { color: var(--red); border-color: rgba(224,72,54,0.4); background: var(--red-soft); font-weight: 600; }
    .badge.blue { color: var(--blue); border-color: rgba(37,99,235,0.4); background: var(--blue-soft); font-weight: 600; }
    .badge.green { color: var(--green); border-color: rgba(21,128,61,0.4); background: var(--green-soft); font-weight: 600; }

    .section-eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--faint);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* =========================================================================
       SLIDE 01: TEST BENCH + WORD FORMULA + 3 FLIP Q&A CARDS
       ========================================================================= */
    .bench-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
    }

    .bench-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .bench-card.is-smart { border-color: var(--blue); background: #f8fbff; }
    .bench-card.is-rule { border-color: var(--red); background: #fffbfa; }

    .svg-box {
      width: 100%;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .fan-blades { transform-origin: 75px 56px; }
    .fan-blades.spin { animation: spinFan 0.55s linear infinite; }
    @keyframes spinFan { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .dog-group.happy { animation: dogHop 0.45s ease-in-out infinite alternate; }
    @keyframes dogHop { from { transform: translate(4px, 0); } to { transform: translate(9px, -5px); } }

    .dog-tail { transform-origin: 42px 76px; }
    .dog-tail.wag { animation: wagTail 0.14s ease-in-out infinite alternate; }
    @keyframes wagTail { from { transform: rotate(-22deg); } to { transform: rotate(24deg); } }

    .speech-bubble {
      position: absolute;
      top: 2px;
      right: 4px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid var(--blue);
      padding: 3px 7px;
      border-radius: var(--r);
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.2s ease;
    }
    .speech-bubble.show { opacity: 1; transform: translateY(0); }

    .formula-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1.35fr;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 12px;
      font-size: 11.5px;
      line-height: 1.38;
    }

    .formula-op {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
    }

    .qa-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .qa-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .qa-card:hover { border-color: var(--ink); }
    .qa-card.open { border-color: var(--blue); background: var(--blue-soft); }

    /* =========================================================================
       SLIDE 02: FIXED RULE MACHINES (FRUIT SORTER, TRAFFIC LIGHT, ATM)
       ========================================================================= */
    .rule-code-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 13px;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.65;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .rule-line {
      padding: 3px 7px;
      border-radius: 2px;
      border-left: 2.5px solid transparent;
      transition: all 0.18s ease;
    }

    .rule-line.hl-pass {
      background: var(--blue-soft);
      border-left-color: var(--blue);
      color: var(--blue);
      font-weight: 600;
    }

    .rule-line.hl-fail {
      background: var(--red-soft);
      border-left-color: var(--red);
      color: var(--red);
      font-weight: 600;
    }

    .fruit-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .fruit-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 9px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      color: var(--ink);
      transition: all 0.14s ease;
    }

    .fruit-btn:hover { border-color: var(--ink); }
    .fruit-btn.tested-ok { border-color: var(--blue); background: var(--blue-soft); }
    .fruit-btn.tested-err { border-color: var(--red); background: var(--red-soft); }
    .fruit-btn.selected { box-shadow: inset 0 0 0 1px var(--ink); }

    .result-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: var(--bg);
      font-size: 12.5px;
    }

    .result-strip.pass { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 600; }
    .result-strip.fail { border-color: var(--red); background: var(--red-soft); color: var(--red); font-weight: 600; }

    /* =========================================================================
       SLIDE 03: 4 EXAMPLE TYPES + 4-STEP PRACTICE SIMULATOR
       ========================================================================= */
    .example-cards-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .mini-sample {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
      font-size: 11px;
    }

    .loop-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .loop-step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 9px 10px;
      font-size: 11.5px;
      line-height: 1.38;
      transition: all 0.2s ease;
    }

    .loop-step.active-blue { border-color: var(--blue); background: var(--blue-soft); }
    .loop-step.active-red { border-color: var(--red); background: var(--red-soft); }

    .clue-bars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .clue-item {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    .clue-track {
      height: 5px;
      background: #ececef;
      border-radius: 2px;
      margin-top: 3px;
      overflow: hidden;
    }

    .clue-fill {
      height: 100%;
      background: var(--blue);
      transition: width 0.25s ease;
    }

    /* =========================================================================
       SLIDE 04: SAME JOB, TWO WAYS
       ========================================================================= */
    .compare-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .cmp-col {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .cmp-col.left-rule { border-top: 2.5px solid var(--red); }
    .cmp-col.right-ai { border-top: 2.5px solid var(--blue); }

    .cmp-step {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--r);
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.42;
      visibility: hidden; opacity: 0;
      transform: translateY(3px);
      transition: all 0.24s ease;
    }

    .cmp-step.show { visibility: visible; opacity: 1; transform: translateY(0); background: var(--bg); }
    .cmp-step.final-red.show { border-color: var(--red); background: var(--red-soft); color: var(--ink); font-weight: 600; }
    .cmp-step.final-blue.show { border-color: var(--blue); background: var(--blue-soft); color: var(--ink); font-weight: 600; }

    /* =========================================================================
       SLIDE 05: MYSTERY BOX GAME (3x2 GRID + CLUE INSPECTOR)
       ========================================================================= */
    .mystery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mbox {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 11px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.14s ease;
    }

    .mbox:hover { border-color: var(--ink); }
    .mbox.focused { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .mbox.solved-rule { border-color: var(--red); background: var(--red-soft); }
    .mbox.solved-ai { border-color: var(--blue); background: var(--blue-soft); }

    /* =========================================================================
       SLIDE 06: NOTEBOOK NOTES + MINI TABLE + 3-Q CHECK
       ========================================================================= */
    .note-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .note-item {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 9px;
      align-items: start;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 9px 12px;
      font-size: 12.5px;
      line-height: 1.44;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .note-item:hover { border-color: var(--ink); }
    .note-item.checked { border-color: var(--blue); background: var(--blue-soft); }

    .note-num {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      background: var(--surface);
      color: var(--ink);
    }

    .note-item.checked .note-num {
      border-color: var(--blue);
      background: var(--blue);

    .bench-card > div:not(.svg-box),.qa-card > div:last-child,.mini-sample,.loop-step,.cmp-step,.note-item,.summary-tbl,.result-strip { font-size: 15px !important; }
    .badge { font-size: 11px; }
    .rule-code-box { font-size: 14px; }
    #workspace { grid-template-columns: minmax(225px, 23%) minmax(0,1fr) 220px; }

    #right-rail { padding: 16px 10px; }

    @media (max-width: 920px) { #workspace { grid-template-columns: 1fr; } #bottom-bar { height:auto; padding:8px; } #app { grid-template-rows:auto auto auto; } #top-bar { flex-wrap:wrap; min-height:42px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    /* Notebook projection: a single readable page for copying. */

    .notes-mode #left-panel { display: none; }

      /* -----------------------------------------------------------------------

      const state = {
        slide: 0,
        time: 0,

        // Slide 01

          calcSolved: false,
          dogLeash: false,
          qaOpen: [false, false, false]
        },

        // Slide 02

        // Slide 03

          exampleTab: 0,       // 0..3

          activeStep: 0,       // 0..4

        // Slide 04

          running: false,
          testedJobs: {}
        },

        // Slide 05
        s5: {
          focusedBox: 0,       // 0..5
          results: {}          // idx -> { picked: 'rule'|'ai', correct: bool }
        },

        // Slide 06
        s6: {
          view: 'notes',       // 'notes' | 'quiz'
          checkedNotes: {},    // 0..4 -> bool
          quizPicked: [null, null, null]
        }
      };

      let timers = [];
      function clearTimers() {
        timers.forEach(id => clearTimeout(id));
        timers = [];
      }

      /* -----------------------------------------------------------------------
         3. LIVE HTML5 <canvas> MONITOR RENDERER
         ----------------------------------------------------------------------- */
      const monCanvas = document.getElementById('mon-canvas');
      const mctx = monCanvas.getContext('2d');

      function resizeMonitorCanvas() {
        const rect = monCanvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        monCanvas.width = Math.max(100, Math.floor(rect.width * dpr));
        monCanvas.height = Math.max(40, Math.floor(rect.height * dpr));
        mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function updateMonitorText() {
        const titleEl = document.getElementById('mon-title');
        const readEl = document.getElementById('mon-readout');
        const rowsEl = document.getElementById('mon-rows');

        if (state.slide === 0) {
          const s = state.s1;
          const tested = (s.fanOn ? 1 : 0) + (s.calcSolved ? 1 : 0) + (s.dogLeash ? 1 : 0);
          const qOpen = s.qaOpen.filter(Boolean).length;
          titleEl.textContent = 'DEMO MONITOR';
          readEl.textContent = s.dogLeash ? 'INTELLIGENT' : 'RULES & LEARNING';
          readEl.style.color = s.dogLeash ? 'var(--blue)' : 'var(--ink)';
          rowsEl.innerHTML = `
            <div class="mon-row"><span class="k">fan / calc</span><span class="v" style="color:var(--red)">fixed rules</span></div>
            <div class="mon-row"><span class="k">pet dog</span><span class="v" style="color:var(--blue)">${s.dogLeash ? 'learned clue!' : 'waiting'}</span></div>
            <div class="mon-row"><span class="k">items tested</span><span class="v">${tested} / 3</span></div>
            <div class="mon-row"><span class="k">q&amp;a revealed</span><span class="v">${qOpen} / 3</span></div>
          `;
        } else if (state.slide === 1) {
          const s = state.s2;
          titleEl.textContent = 'RULE TESTER';
          if (s.tab === 'fruit') {
            const vals = Object.values(s.testedFruits);
            const passed = vals.filter(v => v === 'pass').length;
            const failed = vals.filter(v => v === 'fail').length;
            readEl.textContent = failed > 0 ? `${failed} / 5 FAILED` : `${passed} / 5 TESTED`;
            readEl.style.color = failed > 0 ? 'var(--red)' : 'var(--ink)';
            rowsEl.innerHTML = `
              <div class="mon-row"><span class="k">machine</span><span class="v">Fruit Sorter</span></div>
              <div class="mon-row"><span class="k">passed</span><span class="v" style="color:var(--blue)">${passed}</span></div>
              <div class="mon-row"><span class="k">rule errors</span><span class="v" style="color:var(--red)">${failed}</span></div>
              <div class="mon-row"><span class="k">rule count</span><span class="v">2 fixed rules</span></div>
            `;
          } else if (s.tab === 'traffic') {
            const isNight = s.trafficMode === 'night';
            readEl.textContent = isNight ? 'CAR STUCK 60s' : 'TIMER ACTIVE';
            readEl.style.color = isNight ? 'var(--red)' : 'var(--ink)';
            rowsEl.innerHTML = `
              <div class="mon-row"><span class="k">machine</span><span class="v">Traffic Timer</span></div>
              <div class="mon-row"><span class="k">road state</span><span class="v">${isNight ? '2:00 AM Empty' : 'Busy Daytime'}</span></div>
              <div class="mon-row"><span class="k">rule used</span><span class="v">60s Red Timer</span></div>
              <div class="mon-row"><span class="k">adapts?</span><span class="v" style="color:var(--red)">No (Fixed)</span></div>
            `;

              <div class="mon-row"><span class="k">machine</span><span class="v">ATM Cash Box</span></div>
              <div class="mon-row"><span class="k">wrong tries</span><span class="v">${s.atmWrongCount} / 3</span></div>

          const s = state.s4;

      function drawMonitorCanvas() {
        const w = monCanvas.parentElement.clientWidth;
        const h = monCanvas.parentElement.clientHeight;
        mctx.clearRect(0, 0, w, h);

        // Subtle horizontal baseline
        mctx.strokeStyle = '#f0f0f2';
        mctx.lineWidth = 1;
        mctx.beginPath();
        mctx.moveTo(0, h * 0.5);
        mctx.lineTo(w, h * 0.5);
        mctx.stroke();

        const drawBars = (items) => {
          const padX = 14;
          const barW = (w - padX * 2 - (items.length - 1) * 12) / items.length;
          const maxH = h - 26;
          items.forEach((it, i) => {
            const x = padX + i * (barW + 12);
            const bh = Math.max(4, it.val * maxH);
            const y = h - 16 - bh;
            mctx.fillStyle = '#f3f4f6';
            mctx.fillRect(x, 10, barW, maxH);
            mctx.fillStyle = it.color;
            mctx.fillRect(x, y, barW, bh);
            mctx.fillStyle = '#666666';
            mctx.font = '500 9px "JetBrains Mono", monospace';
            mctx.textAlign = 'center';
            mctx.fillText(it.label, x + barW / 2, h - 4);
          });

        timers.push(setTimeout(() => { s.activeStep = 2; renderAll(); }, 450));
        timers.push(setTimeout(() => {
          s.activeStep = 3;
          s.rounds = Math.min(1000, s.rounds + 1);
          s.accuracy = Math.min(98, s.accuracy + (s.rounds === 1 ? 6 : 3));
          s.clues = {
            curve: Math.min(96, s.clues.curve + 14),
            stem: Math.min(92, s.clues.stem + 12),
            texture: Math.min(94, s.clues.texture + 13),
            color: Math.min(88, s.clues.color + 8)
          };
          s.curvePoints.push(s.accuracy / 100);
          if (s.curvePoints.length > 40) s.curvePoints.shift();
          renderAll();

          s.activeStep = 4;
          s.practicing = false;
          renderAll();
        }, 1450));

      function runFast1000Practice() {
        clearTimers();
        const s = state.s3;
        s.practicing = true;
        s.testedFruitIdx = null;
        let tick = 0;
        const totalTicks = 20;

        function stepTick() {
          tick++;
          const frac = tick / totalTicks;
          const eased = 1 - Math.pow(1 - frac, 2.4);
          s.rounds = Math.round(eased * 1000);
          s.accuracy = 48 + eased * 50; // 48% -> 98%
          s.activeStep = (tick % 4) + 1;
          s.clues = {
            curve: Math.round(18 + eased * 78),
            stem: Math.round(15 + eased * 77),
            texture: Math.round(20 + eased * 74),
            color: Math.round(35 + eased * 53)
          };
          s.curvePoints.push(s.accuracy / 100);
          if (s.curvePoints.length > 40) s.curvePoints.shift();
          renderAll();
          if (tick < totalTicks) {
            timers.push(setTimeout(stepTick, 65));
          } else {
            s.practicing = false;
            s.activeStep = 4;
            renderAll();
          }
        }
        stepTick();
      }

        const s = state.s4;
        const job = DAILY_JOBS[s.jobIdx];
        const el = document.getElementById('stage-inner');

        el.innerHTML = `
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${DAILY_JOBS.map((j, i) => `
              <button class="sci-btn ${s.jobIdx === i ? 'active-blue' : ''}" data-job="${i}">Q${i + 13} · ${j.short}</button>

          <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 14px;">
            <span style="font-size:12.5px; font-weight:600;">Q${s.jobIdx + 13} · ${['How does face unlock recognize a person?','How can AI help manage traffic?','How can a keyboard suggest the right word?','How does a video app suggest videos?','How can AI help identify unhealthy plants?'][s.jobIdx]}</span>
            <button id="s4-run" class="sci-btn active-red">
              ${s.running ? 'running...' : '▶ ' + job.testBtn}
            </button>
          </div>

          <div class="compare-2">
            <!-- Normal Computer (Fixed Rules) -->
            <div class="cmp-col left-rule">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <div>
                  <span class="badge red" style="margin-bottom:4px;">NORMAL COMPUTER</span>

                </div>
                ${job.ruleSvg}
              </div>
              <div class="cmp-step ${s.step >= 1 ? 'show' : ''}">${job.ruleSteps[0]}</div>
              <div class="cmp-step ${s.step >= 2 ? 'show' : ''}">${job.ruleSteps[1]}</div>
              <div class="cmp-step final-red ${s.step >= 3 ? 'show' : ''}">${job.ruleSteps[2]}</div>
            </div>

            <!-- AI (Learning from Examples) -->
            <div class="cmp-col right-ai">
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <div>
                  <span class="badge blue" style="margin-bottom:4px;">AI · LEARNING</span>
                  <div style="font-size:14.5px; font-weight:600;">${job.aiName}</div>
                </div>
                ${job.aiSvg}
              </div>
              <div class="cmp-step ${s.step >= 1 ? 'show' : ''}">${job.aiSteps[0]}</div>
              <div class="cmp-step ${s.step >= 2 ? 'show' : ''}">${job.aiSteps[1]}</div>
              <div class="cmp-step final-blue ${s.step >= 3 ? 'show' : ''}">${job.aiSteps[2]}</div>
            </div>
          </div>
        `;

        el.querySelectorAll('[data-job]').forEach(b => {
          b.onclick = () => {
            s.jobIdx = parseInt(b.dataset.job, 10);
            clearTimers(); s.step = 0; s.running = false; renderAll();
          };
        });
        document.getElementById('s4-run').onclick = runJobAnimation;
      }

      /* -----------------------------------------------------------------------
         8. SLIDE 05 — GAME: "AI OR NOT? MYSTERY BOX"
         ----------------------------------------------------------------------- */
      const MYSTERY_BOXES = [
        {
          num: 'Q18 · BOX 01',
          name: 'Automatic Mall Door',
          clue: 'Slides open whenever someone walks near it.',
          answer: 'rule',
          reason: 'Not AI (Fixed Rule): IF sensor feels movement THEN open door. It even opens for a rolling ball or stray dog!',
          svg: `<svg width="36" height="36" viewBox="0 0 36 36"><rect x="4" y="5" width="12" height="26" fill="#fafafa" stroke="#111" stroke-width="1.4"/><rect x="20" y="5" width="12" height="26" fill="#fafafa" stroke="#111" stroke-width="1.4"/><path d="M12 18 L6 18 M24 18 L30 18" stroke="#e04836" stroke-width="1.8"/></svg>`
        },
        {
          num: 'Q19 · BOX 02',
          name: 'Phone Voice Assistant',
          clue: 'Understands "Set an alarm for 6 AM" spoken by a child or an adult.',
          answer: 'ai',
          reason: 'AI (Learning): Uses patterns learned from speech recordings to recognize words spoken in different voices.',
          svg: `<svg width="36" height="36" viewBox="0 0 36 36"><rect x="14" y="6" width="8" height="15" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><path d="M10 18 A8 8 0 0 0 26 18" stroke="#111" stroke-width="1.5" fill="none"/><line x1="18" y1="26" x2="18" y2="31" stroke="#111" stroke-width="1.6"/></svg>`
        },
        {
          num: 'Q20 · BOX 03',
          name: 'School Bell Timer',
          clue: 'Rings automatically at 10:00 AM every day.',
          answer: 'rule',
          reason: 'Not AI (Fixed Rule): IF time == 10:00 AM THEN ring bell. It even rings on a Sunday unless switched off!',
          svg: `<svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="#fafafa" stroke="#111" stroke-width="1.5"/><line x1="18" y1="18" x2="18" y2="11" stroke="#e04836" stroke-width="1.8"/><line x1="18" y1="18" x2="24" y2="18" stroke="#111" stroke-width="1.6"/></svg>`
        },
        {
          num: 'Q21 · BOX 04',
          name: 'Spam Email Filter',
          clue: 'A filter trained on examples of normal and scam emails flags suspicious messages.',
          answer: 'ai',
          reason: 'AI (Learning): Learns patterns from examples of ordinary and scam emails; it can flag suspicious messages.',
          svg: `<svg width="36" height="36" viewBox="0 0 36 36"><rect x="5" y="9" width="26" height="18" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><polyline points="5,10 18,20 31,10" stroke="#2563eb" stroke-width="1.5" fill="none"/></svg>`
        },
        {
          num: 'Q22 · BOX 05',
          name: 'Washing Machine Timer',
          clue: 'Washes clothes for 30 minutes and stops.',
          answer: 'rule',
          reason: 'Not AI (Fixed Rule): Only counts down 30 minutes and stops; never checks if the clothes are actually clean.',
          svg: `<svg width="36" height="36" viewBox="0 0 36 36"><rect x="6" y="5" width="24" height="26" rx="2" fill="#fafafa" stroke="#111" stroke-width="1.5"/><circle cx="18" cy="20" r="7" fill="#fff" stroke="#e04836" stroke-width="1.5"/></svg>`
        },
        {
          num: 'Q23 · BOX 06',
          name: 'Google Maps Traffic Alert',
          clue: 'Uses past and live traffic patterns to predict a jam and suggest a route.',
          answer: 'ai',
          reason: 'AI (Learning): Uses live traffic data and learned traffic patterns to predict delays.',
          svg: `<svg width="36" height="36" viewBox="0 0 36 36"><path d="M8 29 Q14 14 28 8" stroke="#2563eb" stroke-width="2.2" fill="none"/><circle cx="18" cy="18" r="3.5" fill="#e04836"/><circle cx="28" cy="8" r="3" fill="#2563eb"/></svg>`
        }
      ];

      function renderSlide5() {
        const s = state.s5;
        const box = MYSTERY_BOXES[s.focusedBox];
        const res = s.results[s.focusedBox];
        const el = document.getElementById('stage-inner');

        el.innerHTML = `
          <!-- 6 Mystery Box Grid -->
          <div class="mystery-grid">
            ${MYSTERY_BOXES.map((b, i) => {
              const r = s.results[i];
              const cls = (s.focusedBox === i ? 'focused ' : '') + (r ? (b.answer === 'ai' ? 'solved-ai' : 'solved-rule') : '');
              return `
                <div class="mbox ${cls}" data-box="${i}">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="badge ${r ? (b.answer === 'ai' ? 'blue' : 'red') : ''}">${b.num}</span>
                    ${r ? `<span style="font-family:var(--mono); font-size:10px; font-weight:600; color:${r.correct ? 'var(--green)' : 'var(--red)'};">${r.correct ? '✓ RIGHT' : '↺ REVEALED'}</span>` : '<span style="font-family:var(--mono); font-size:10px; color:var(--faint);">OPEN ?</span>'}
                  </div>
                  <div style="display:flex; align-items:center; gap:9px;">
                    ${b.svg}
                    <strong style="font-size:12.5px; line-height:1.25;">${b.name}</strong>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Active Clue Inspection Panel -->
          <div class="card" style="display:flex; flex-direction:column; gap:10px; border-color:${res ? (box.answer === 'ai' ? 'var(--blue)' : 'var(--red)') : 'var(--border-strong)'};">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="badge ${box.answer === 'ai' && res ? 'blue' : res ? 'red' : ''}">${box.num} · ${box.name.toUpperCase()}</span>
              <span style="font-family:var(--mono); font-size:10px; color:var(--faint);">PICK YOUR ANSWER BELOW</span>
            </div>

            <div style="display:flex; align-items:center; gap:12px;">
              ${box.svg}
              <div style="font-size:14px; font-weight:500; color:var(--ink); line-height:1.4;">
                "${box.clue}"
              </div>
            </div>

            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button id="s5-pick-rule" class="sci-btn ${res && res.picked === 'rule' ? 'active-red' : ''}" style="padding:8px 16px; font-size:11.5px;">
                Fixed Rules (Not AI)
              </button>
              <button id="s5-pick-ai" class="sci-btn ${res && res.picked === 'ai' ? 'active-blue' : ''}" style="padding:8px 16px; font-size:11.5px;">
                Learning-based AI
              </button>
            </div>

            ${res ? `
              <div class="result-strip ${res.correct ? 'pass' : 'fail'}">
                <span>${res.correct ? '🎉 Spot on! ' : 'Good try! '}${box.reason}</span>
              </div>
            ` : ''}
          </div>
        `;

        el.querySelectorAll('[data-box]').forEach(card => {
          card.onclick = () => { s.focusedBox = parseInt(card.dataset.box, 10); renderAll(); };
        });

        document.getElementById('s5-pick-rule').onclick = () => {
          s.results[s.focusedBox] = { picked: 'rule', correct: box.answer === 'rule' };
          renderAll();
        };
        document.getElementById('s5-pick-ai').onclick = () => {
          s.results[s.focusedBox] = { picked: 'ai', correct: box.answer === 'ai' };
          renderAll();
        };
      }

      /* -----------------------------------------------------------------------
         9. SLIDE 06 — NOTEBOOK SUMMARY & 3-QUESTION MEMORY CHECK
         ----------------------------------------------------------------------- */
      const NOTEBOOK_POINTS = [
        '<strong>Intelligence:</strong> The ability to learn, understand, solve problems and make decisions. <em>Example: A dog learns that a leash means a walk.</em>',
        '<strong>Artificial:</strong> Something made by humans, such as a plastic flower.',
        '<strong>Artificial Intelligence (AI):</strong> Technology that enables computers to perform tasks that normally require human intelligence. AI helps solve problems that are difficult to describe with simple rules.',
        '<strong>Fixed rules:</strong> Instructions that a computer follows. Example: IF the time is 10 AM, THEN ring the school bell.',
        '<strong>Learning from examples:</strong> Many AI systems learn patterns from <strong>data</strong> (pictures, sounds, words or numbers). A <strong>label</strong> is the correct name or answer. <strong>Training</strong> is the process of learning from data. Example: Learning to recognize mangoes from different pictures. AI can make mistakes.'
      ];

      const FINAL_QUIZ = [
        {
          q: 'Q24 · Is a simple automatic mall door AI?',
          opts: ['A) Yes, because it moves automatically', 'B) No, it follows one fixed IF → THEN sensor rule', 'C) Yes, because it uses electricity'],
          correct: 1,
          exp: 'Right! Automatic doors only follow one strict rule—they do not learn from examples.'
        },
        {
          q: 'Q25 · How does an AI fruit sorter learn to spot a green raw mango?',
          opts: ['A) By practicing on hundreds of labeled mango photos', 'B) By guessing randomly forever', 'C) By reading a single "yellow only" rule'],
          correct: 0,
          exp: 'Spot on! Practicing on labeled examples helps AI learn curves, stems, and textures.'
        },
        {
          q: 'Q26 · Which pair lists two real-world examples of AI?',
          opts: ['A) Calculator and School Bell Timer', 'B) Phone Face Unlock and Google Maps Traffic Alert', 'C) Ceiling Fan and Washing Machine Timer'],
          correct: 1,
          exp: 'Great job! Both Face Unlock and Maps Traffic Alerts learn from real-world examples.'
        }
      ];

      function renderSlide6() {
        const s = state.s6;
        const el = document.getElementById('stage-inner');

        const toggleBar = `
          <div style="display:flex; gap:8px;">
            <button id="s6-tab-notes" class="sci-btn ${s.view === 'notes' ? 'active-blue' : ''}">Notebook Notes</button>
            <button id="s6-tab-quiz" class="sci-btn ${s.view === 'quiz' ? 'active-red' : ''}">3-Question Memory Check</button>
          </div>
        `;

        if (s.view === 'notes') {
          el.innerHTML = `
            ${toggleBar}
            <div class="notebook-heading"><strong>Chapter 01 · What is Artificial Intelligence?</strong><span>NOTEBOOK · 10 MIN</span></div>
            <div class="note-list">
              ${NOTEBOOK_POINTS.map((html, i) => {
                const chk = Boolean(s.checkedNotes[i]);
                return `
                  <div class="note-item ${chk ? 'checked' : ''}" data-note="${i}">
                    <div class="note-num">${chk ? '✓' : (i + 1)}</div>
                    <div>${html}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <table class="summary-tbl">
              <thead>
                <tr>
                  <th style="width:22%;">FEATURE</th>
                  <th style="width:39%; color:var(--red);">FIXED RULES (NORMAL)</th>
                  <th style="width:39%; color:var(--blue);">AI (LEARNING FROM EXAMPLES)</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>How it works</strong></td>
                  <td>Follows given instructions</td>
                  <td>Learns patterns from examples</td>
                </tr>
                <tr>
                  <td><strong>Analogy</strong></td>
                  <td>Following a recipe</td>
                  <td>Learning to cook by practice</td>
                </tr>
                <tr>
                  <td><strong>New situations</strong></td>
                  <td>May miss situations not covered by rules</td>
                  <td>Uses learned patterns; may be wrong</td>
                </tr>
                <tr>
                  <td><strong>Examples</strong></td>
                  <td>Calculator, alarm clock</td>
                  <td>Face unlock, voice assistant, video suggestions</td>
                </tr>
              </tbody>
            </table>
          `;

          el.querySelectorAll('[data-note]').forEach(row => {
            row.onclick = () => {
              const i = parseInt(row.dataset.note, 10);
              s.checkedNotes[i] = !s.checkedNotes[i];
              renderAll();
            };
          });
        } else {
          el.innerHTML = `
            ${toggleBar}
            <div class="quiz-3">
              ${FINAL_QUIZ.map((item, qIdx) => {
                const picked = s.quizPicked[qIdx];
                return `
                  <div class="card" style="display:flex; flex-direction:column; gap:7px;">
                    <div style="font-size:13px; font-weight:600;">${item.q}</div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                      ${item.opts.map((txt, oIdx) => {
                        let cls = '';
                        if (picked !== null) {
                          if (oIdx === item.correct) cls = 'is-right';
                          else if (oIdx === picked) cls = 'is-wrong';
                        }
                        return `<button class="quiz-opt ${cls}" data-fq="${qIdx}" data-fo="${oIdx}">${txt}</button>`;
                      }).join('')}
                    </div>
                    ${picked !== null ? `<div style="font-size:11.5px; color:${picked === item.correct ? 'var(--blue)' : 'var(--red)'}; font-weight:500;">${picked === item.correct ? '✓ ' : '✗ '}${item.exp}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `;

          el.querySelectorAll('.quiz-opt').forEach(btn => {
            btn.onclick = () => {
              const q = parseInt(btn.dataset.fq, 10);
              const o = parseInt(btn.dataset.fo, 10);
              s.quizPicked[q] = o;
              renderAll();
            };
          });
        }

        document.getElementById('s6-tab-notes').onclick = () => { s.view = 'notes'; renderAll(); };
        document.getElementById('s6-tab-quiz').onclick = () => { s.view = 'quiz'; renderAll(); };
      }

      /* -----------------------------------------------------------------------
         10. MASTER RENDER, NAVIGATION & ANIMATION LOOP
         ----------------------------------------------------------------------- */
      function renderEditorial() {
        const m = SLIDES[state.slide];
        document.getElementById('top-slide-label').textContent = m.topLabel;
        document.getElementById('top-rule-label').textContent = m.topRule;
        document.getElementById('top-counter').textContent = `${state.slide + 1} / ${SLIDES.length}`;
        document.getElementById('ed-tag').textContent = m.tag;
        document.getElementById('ed-h1').textContent = m.h1;
        document.getElementById('ed-h2').textContent = m.h2;
        document.getElementById('ed-intro').textContent = m.intro;

        document.getElementById('ed-meta').innerHTML = m.meta.map(([k, v]) => {
          const cls = k === 'question' ? 'k-red' : (k === 'try' ? 'k-blue' : '');
          return `<div class="meta-k ${cls}">${k}</div><div class="meta-v">${v}</div>`;
        }).join('');

        document.getElementById('btn-prev').disabled = (state.slide === 0);
        document.getElementById('btn-next').disabled = (state.slide === SLIDES.length - 1);

        document.querySelectorAll('.slide-pill').forEach(p => {
          p.classList.toggle('active', parseInt(p.dataset.slide, 10) === state.slide);
        });
      }

      function renderAll() {
        document.getElementById('workspace').classList.toggle('notes-mode', state.slide === 5 && state.s6.view === 'notes');
        renderEditorial();
        updateMonitorText();
        const fns = [renderSlide1, renderSlide2, renderSlide3, renderSlide4, renderSlide5, renderSlide6];
        fns[state.slide]();
        drawMonitorCanvas();
      }

      function goToSlide(idx) {
        if (idx < 0 || idx >= SLIDES.length) return;
        clearTimers();
        state.slide = idx;
        state.s3.practicing = false; state.s4.running = false;
        document.getElementById('stage').scrollTop = 0;
        document.getElementById('left-panel').scrollTop = 0;
        renderAll();
      }

      function resetCurrentSlide() {
        clearTimers();
        if (state.slide === 0) state.s1 = { fanOn: false, calcSolved: false, dogLeash: false, qaOpen: [false, false, false] };
        else if (state.slide === 1) state.s2 = { tab: 'fruit', selectedFruit: null, testedFruits: {}, trafficMode: 'day', atmStatus: 'ready', atmWrongCount: 0 };
        else if (state.slide === 2) state.s3 = { exampleTab: 0, rounds: 0, accuracy: 48, activeStep: 0, practicing: false, testedFruitIdx: null, curvePoints: [0.48, 0.48], clues: { curve: 18, stem: 15, texture: 20, color: 35 } };
        else if (state.slide === 3) state.s4 = { jobIdx: 0, step: 0, running: false, testedJobs: {} };
        else if (state.slide === 4) state.s5 = { focusedBox: 0, results: {} };
        else if (state.slide === 5) state.s6 = { view: 'notes', checkedNotes: {}, quizPicked: [null, null, null] };
        renderAll();
      }

      document.getElementById('btn-prev').onclick = () => goToSlide(state.slide - 1);
      document.getElementById('btn-next').onclick = () => goToSlide(state.slide + 1);
      document.getElementById('btn-reset').onclick = resetCurrentSlide;
      document.querySelectorAll('.slide-pill').forEach(p => {
        p.onclick = () => goToSlide(parseInt(p.dataset.slide, 10));
      });

      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowRight') goToSlide(state.slide + 1);
        else if (e.key === 'ArrowLeft') goToSlide(state.slide - 1);
      });

      window.addEventListener('resize', () => {
        resizeMonitorCanvas();
        drawMonitorCanvas();
      });

      let lastT = 0;
      function loop(ts) {
        requestAnimationFrame(loop);
        const dt = Math.min(0.05, (ts - lastT) / 1000 || 0.016);
        lastT = ts;
        state.time += dt;
        drawMonitorCanvas();
      }

      function init() {
        resizeMonitorCanvas();
        renderAll();
        requestAnimationFrame(loop);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();
  </script>
</body>
