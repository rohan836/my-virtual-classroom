olumn;justify-content:center;align-items:center;gap:12px;position:relative;text-align:center;overflow:hidden}.stage svg.scene{width:100%;max-height:260px;min-height:160px}.stage .cap{font-size:20px;line-height:1.3;min-height:32px}.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.row button{font-size:19px}.controls{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}.controls button{font-size:17px}.steps{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}.steps button{font:14px ui-monospace,monospace;padding:7px 10px}.steps button[aria-current=true]{border-color:var(--blue);background:var(--light);color:#1749b5}.progress{height:4px;background:#eee}.progress span{display:block;height:4px;background:var(--blue);transition:width .25s}.take{background:#fff;border:1px solid var(--line);padding:12px 15px;margin-top:12px;font-size:18px;display:flex;gap:12px;align-items:baseline}.take b{color:#1749b5;white-space:nowrap}.pop{animation:appear .42s both}.travel{animation:travel 1.3s ease-in-out both}.fade{animation:appear .65s both}.scan{animation:scan 1.5s ease-in-out infinite alternate}.spin{animation:turn 1.2s ease-in-out both;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse .9s ease-in-out 2;transform-box:fill-box;transform-origin:center}.trace{stroke-dasharray:8 8;animation:trace 1.2s linear infinite}.delay{animation-delay:.35s}.delay2{animation-delay:.7s}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes travel{from{transform:translateX(-90px);opacity:.3}to{transform:translateX(0);opacity:1}}@keyframes scan{to{transform:translateY(55px)}}@keyframes turn{from{transform:rotate(-35deg)}to{transform:rotate(0)}}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes trace{to{stroke-dashoffset:-32}}.fruitbutton{display:grid;justify-items:center;gap:3px;min-width:98px}.fruitbutton svg{width:76px;height:76px}.fruitbutton small{font-size:14px}.feedback{width:100%;padding:9px 12px;border:1px solid var(--line);font-size:19px;min-height:45px;text-align:left}.good{color:#13733b}.bad{color:#b33225}.muted{color:var(--muted);font-size:15px}.train-grid{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.train-grid>div{border:1px solid var(--line);padding:5px;min-width:65px;font-size:13px}.train-grid svg{width:55px;height:55px;display:block;margin:auto}.notes{max-width:1000px;margin:auto;background:white;border:1px solid var(--line);padding:20px;font-size:21px}.notes p{margin:7px 0}.notes table{border-collapse:collapse;width:100%;font-size:19px}.notes th,.notes td{border:1px solid var(--line);padding:7px 12px;text-align:left}dialog{width:min(640px,92vw);max-height:90vh;overflow:auto;border:1px solid #aaa;padding:25px;color:#111;font-size:22px}dialog::backdrop{background:#1116}dialog .row{justify-content:flex-start}.dictionary{display:flex;flex-wrap:wrap;gap:8px}.dictionary button{font-size:17px}.reveal{border:1px solid var(--line);padding:12px;font-size:20px;background:#fafafa}.compact{font-size:16px}#jump{max-width:210px}.selected{border:2px solid var(--blue);background:var(--light)}@media(max-width:780px){.layout{grid-template-columns:1fr}.stage{min-height:260px}.stage svg.scene{max-height:220px}header,footer{flex-wrap:wrap;padding:7px 10px}main{padding:14px}.take{display:block}.copy{font-size:20px}.panel{padding:14px}.notes{font-size:18px}#jump{max-width:160px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
'use strict';const $=id=>document.getElementById(id);const terms={intelligence:['Intelligence','The ability to learn, understand and solve problems.','A child recognizes a green mango after seeing other mangoes.','human'],artificial:['Artificial','Made by people rather than produced by nature.','A plastic mango is artificial; a mango growing on a tree is natural.','natural'],AI:['Artificial Intelligence (AI)','Technology that allows computers to perform tasks that usually need human intelligence.','A computer identifies fruit in a picture.','machine'],computer:['Computer','A machine that follows instructions and works with information.','A phone is a small computer.','machine'],rule:['Fixed rule','An instruction that says exactly what to do.','If the fruit is yellow, call it a mango.','rule'],data:['Data','Information that a computer can use. It can be pictures, words, numbers or sounds.','Pictures of four fruits are data.','data'],label:['Label','The name or correct answer attached to an example.','A picture marked “mango” has a label.','label'],pattern:['Pattern','A feature or similarity that appears repeatedly.','Many mangoes have a similar oval shape even when colours differ.','pattern'],training:['Training','The process of learning from examples.','Showing a computer different named fruit pictures.','training'],model:['Model','The result of learning that a computer uses to make an answer.','A fruit recognizer that compares new fruit with learned examples.','machine'],prediction:['Prediction','An answer or guess based on information already learned.','The computer says “mango” when it sees a new fruit.','predict'],automatic:['Automatic','Something that works by itself after being set up.','A school bell rings at a set time without anyone pressing it.','clock'],feature:['Feature','A detail that helps describe something.','The colour and shape of a fruit are two features.','pattern']};
const T=(k,s=terms[k][0])=>'<button class="term" data-word="'+k+'">'+s+'</button>';const F=[['Yellow mango','mango','#edb72d',1,1],['Red apple','apple','#df5549',0,0],['Green mango','mango','#89af4d',0,1],['Green apple','apple','#89af4d',0,0],['Orange mango','mango','#ed9140',0,1],['Yellow apple','apple','#edb72d',1,0],['Dark green mango','mango','#4d8a3c',0,1]];
function fruit(i,x=0,y=0,s=1){let f=F[i];return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="'+(f[1]==='mango'?'M57 16 C94 18 94 64 59 91 C30 112 8 82 15 55 C21 31 39 15 57 16Z':'M50 31 C18 7 4 43 17 75 C28 102 43 97 50 91 C65 106 84 91 91 65 C100 32 74 14 50 31Z')+'" fill="'+f[2]+'" stroke="#383838" stroke-width="1.7"/><path d="M52 25 Q49 11 58 5" fill="none" stroke="#6c4b2e" stroke-width="5"/><path d="M55 14 Q74 0 87 11 Q74 25 55 14" fill="#528844"/><path d="M30 36 Q22 49 26 64" fill="none" stroke="#fff" stroke-opacity=".68" stroke-width="5" stroke-linecap="round"/></g>'}
const svg=(s,label='Illustration')=>'<svg class="scene" viewBox="0 0 660 260" role="img" aria-label="'+label+'">'+s+'</svg>';const text=(x,y,s,size=20,color='#111')=>'<text x="'+x+'" y="'+y+'" font-family="system-ui,sans-serif" font-size="'+size+'" text-anchor="middle" fill="'+color+'">'+s+'</text>';const box=(x,y,w,h,fill='#fff',stroke='#bbb')=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5"/>';const arrow=(x,y,x2,y2)=>'<path d="M'+x+' '+y+' L'+x2+' '+y2+'" fill="none" stroke="#2563eb" stroke-width="3" class="trace"/><path d="M'+(x2-12)+' '+(y2-7)+' L'+x2+' '+y2+' L'+(x2-12)+' '+(y2+7)+'" fill="none" stroke="#2563eb" stroke-width="3"/>';const group=(s,c='fade')=>'<g class="'+c+'">'+s+'</g>';function computer(x,y,label='?',w=160){return '<g transform="translate('+x+' '+y+')">'+box(0,0,w,95,'#f0f5ff','#2563eb')+box(9,9,w-18,70,'#fff','#d3dff9')+text(w/2,53,label,21,'#1548a6')+'<path d="M'+w/2+' 95v18m-30 0h60" stroke="#111" stroke-width="3"/></g>'}function human(x,y){return '<g transform="translate('+x+' '+y+')"><circle cx="45" cy="40" r="31" fill="#e7b48b" stroke="#433b34"/><path d="M16 32 Q12 0 45 5 Q78 5 76 32 Q45 12 16 32" fill="#38312f"/><circle cx="34" cy="40" r="2.7"/><circle cx="57" cy="40" r="2.7"/><path d="M36 55q10 9 20 0" stroke="#593b2b" stroke-width="2" fill="none"/><path d="M5 128v-22q0-30 40-30t40 30v22" fill="#dde8ff" stroke="#2563eb" stroke-width="2"/></g>'}function picture(i,x,y,label=''){return box(x,y,122,130,'white','#c7c7c7')+fruit(i,x+20,y+3,.84)+(label?text(x+61,y+119,label,17):'')}
function scene(kind,n=0){let s='';if(kind==='human'){s=group(fruit(0,40,60,1.25),'travel')+human(268,55)+text(312,218,'Person');if(n>0)s+=arrow(165,120,260,120)+group(box(402,29,220,55,'#f0f5ff','#2563eb')+text(512,64,'A mango!',24));if(n>1)s+=group(fruit(2,484,100,1.2)+text(540,236,'Still a mango',20),'pulse');}
if(kind==='natural'){s=group('<path d="M135 165V75" stroke="#84613e" stroke-width="18"/><circle cx="135" cy="63" r="58" fill="#b6d89b"/>'+fruit(0,112,43,.45)+text(135,210,'Natural',23));if(n>0)s+=group(fruit(0,422,50,1.35)+text(485,210,'Made by people',23)+text(485,237,'Plastic mango',16),'fade delay');if(n>1)s+=group(text(325,118,'≠',42,'#e04836'));}
if(kind==='machine'){if(n===0){s=fruit(0,75,62,1.2)+arrow(200,120,264,120)+human(280,50)+group(box(405,50,210,65,'#f0f5ff','#2563eb')+text(510,90,'A mango!',25),'fade delay')+text(325,226,'Human recognizes the fruit',20);}else{s=group(picture(0,20,45,'Photo'))+arrow(150,112,234,112)+group(computer(240,62,'AI model',180)+text(330,205,'Uses learned patterns',17),'fade delay')+arrow(425,112,500,112)+group(box(505,62,145,101,'#f0f5ff','#2563eb')+text(577,95,'Prediction',16,'#1548a6')+text(577,131,'Mango',25),'fade delay2');if(n>1)s+=group(text(330,243,'A person can check the result.',19,'#13733b'),'fade delay2');}}
if(kind==='rule'){s=fruit(n===0?0:n===1?2:5,32,70,1.2)+arrow(158,120,222,120)+box(230,48,205,142,'#fff','#e04836')+text(332,80,'FIXED RULE',17,'#b33225')+text(332,115,'If yellow,',23)+text(332,148,'say mango.',23)+arrow(442,120,510,120)+group(box(515,78,135,84,n===0?'#f0f5ff':'#fff6f5',n===0?'#2563eb':'#e04836')+text(582,112,n===1?'Not mango':'Mango',19)+text(582,140,n===0?'Correct':'Wrong!',17,n===0?'#13733b':'#b33225'),'fade delay');}
if(kind==='data'||kind==='label'||kind==='pattern'){s=[0,1,2,3].map((i)=>group(picture(i,34+151*i,42,n>0?F[i][1]:''),i%2?'fade delay':'fade')).join('');if(n===0)s+=text(330,224,'Pictures = information',23,'#2563eb');if(n===1)s+=text(330,224,'Picture + correct name = labelled example',21,'#2563eb');if(n>1)s+=group('<path d="M95 185 Q95 216 245 216 M397 185 Q397 216 245 216" fill="none" stroke="#2563eb" stroke-width="3"/>'+text(330,246,'Similar shapes, different colours',20,'#2563eb'));}
if(kind==='training'){s=picture(0,12,60,'mango')+picture(1,146,60,'apple')+arrow(278,120,341,120)+computer(350,65,n===0?'Examples':n===1?'Compare':'Learned',160);if(n>0)s+=group(text(430,222,n===1?'Find similarities':'Ready to test',20),'fade delay');if(n>1)s+=arrow(520,115,554,115)+group(fruit(2,556,75,.85),'fade delay2');}
if(kind==='predict'){s=fruit(4,20,75,1.1)+arrow(135,120,222,120)+computer(232,68,n>0?'Compare':'?',175)+arrow(420,120,480,120)+group(box(490,69,155,100,'#f0f5ff','#2563eb')+text(567,110,n>0?'Mango':'?',23)+text(567,141,n>1?'Correct!':'Prediction',17),'fade delay');}
if(kind==='clock'){s='<circle cx="160" cy="116" r="77" fill="white" stroke="#555" stroke-width="3"/><path d="M160 116V64 M160 116l35 17" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>'+text(160,225,'School bell',22)+arrow(250,116,365,116)+group(box(380,61,242,110,'#fff','#e04836')+text(501,103,'10:00 → Ring',26)+text(501,139,'Fixed instruction',19));}return svg(s,kind+' illustration');}
const S=(h,p,e,kind,n,cap,ask,answer)=>({h,p,e,kind,n,cap,ask,answer});
const slides=[
{title:'How do people recognize things?',short:'Intelligence',time:3,steps:[S('Q01 · What is intelligence?','A person can learn, understand and solve problems. This ability is called '+T('intelligence')+'.',"Imagine a student going to a fruit shop with her mother. The shopkeeper shows her a mango and tells her its name. Later, she notices another mango in a basket and recognizes it without asking anyone. She is using what she learned earlier.",'human',0,'Look at the fruit. What is it?','How does a person know the fruit?',"She has seen mangoes before and remembers useful details such as their shape and skin. She uses that experience to recognize a new mango. This is a small example of human intelligence."),S('Q02 · How does learning help?','People learn by seeing, hearing and practising. Remembered examples help with new situations.',"A student learning to ride a bicycle may wobble on the first day. After practising several times, he learns how to balance, turn and stop. The next time he rides, he uses what he learned before. Learning helps him deal with a new situation.",'human',1,'See → remember → recognize','Does a child know every fruit from birth?',"No. A child learns fruit names by seeing fruits, hearing their names and practising. After seeing several examples, the child can often recognize a fruit that looks a little different."),S("Q03 · Can the same kind of fruit look different?",'A green mango and a yellow mango look different, but both are mangoes. Intelligence helps recognize similarities.',"At a market, a child sees a green mango next to a yellow mango. At first, she thinks they are different fruits. The seller explains that mangoes can have different colours. She notices their similar shapes and learns not to depend only on colour.",'human',2,'Different colour. Same fruit.','Does intelligence mean simply being fast?',"No. A calculator can add numbers very quickly, but speed alone is not intelligence. Learning from experience, recognizing similarities and solving a new problem are more useful examples of intelligence.")]},
{title:'Natural or artificial?',short:'Artificial',time:4,steps:[S('Q04 · What is natural?','Something produced by nature, rather than made by people, is natural.',"Think about a mango tree in a school garden. With sunlight, water and time, the tree grows fruit. Nobody needs to build the mango in a factory. It is a natural fruit, produced by a living tree.",'natural',0,'A real mango grows on a tree.','Is a mango tree a machine?',"No. A mango tree is a living thing. It grows and needs water and sunlight. A machine, such as a water pump, is made by people to do a particular job."),S('Q05 · What is artificial?','Something made by people is called '+T('artificial')+'. It can look like something natural.',"A shopkeeper puts a plastic mango in a display basket. From far away it looks like real fruit, but it cannot ripen or grow. People shaped and coloured plastic to look like a mango. That makes it artificial.",'natural',1,'Real fruit and a man-made fruit','Does an artificial mango grow?',"No. A plastic mango is made in a factory and cannot grow or ripen. A natural mango grows on a tree. Looking like a real mango does not make the plastic one alive."),S('Q06 · Why use this word in AI?','Artificial intelligence is made by people. It is not the natural intelligence of a person or animal.',"Imagine someone building a phone app that names fruit in a photo. The app did not grow naturally like a person or animal. People designed it and trained it to do a useful task. That is why its intelligence is called artificial.",'natural',2,'Natural intelligence ≠ artificial intelligence','Is every artificial object intelligent?',"No. A plastic mango and a chair are artificial because people made them. They cannot recognize pictures or learn a task. AI is a special kind of technology made to perform tasks that usually need intelligence.")]},
{title:'What is artificial intelligence?',short:'AI',time:3,steps:[S('Q07 · What can a person do?','Recognizing objects, understanding words and solving problems are tasks that can require human intelligence.',"A student enters a classroom and recognizes a friend even when the friend wears different clothes. She remembers the friend's face and voice. Recognizing something despite small changes is one of the abilities people use every day.",'machine',0,'Human recognizes a mango.','Can a person recognize a fruit without a computer?',"Yes. People can use their eyes, memory and past experience to recognize a fruit. A computer needs information and a suitable program or AI model to perform a similar recognition task."),S('Q08 · What is AI?',T('AI')+' is technology that helps '+T('computer','computers')+' do tasks that usually need human intelligence. For example, AI can recognize objects in pictures, turn speech into words or help answer a question. Many AI systems learn from examples and use what they learned on new information.',"Imagine taking a photo of a mango with a phone. An AI photo app may suggest that the picture contains a mango. It can do this because its model learned useful visual patterns from many pictures. You did not have to tell it the exact colour or shape of this particular mango.",'machine',1,'Photo → AI model → predicted name','Does AI mean a robot with a human brain?',"No. AI is not a robot brain. It is technology that can run inside a phone, laptop or other machine. A photo app can use AI without moving, speaking or having a robot body."),S('Q09 · Why make AI?',"We use AI when a task is difficult to describe with a few simple instructions. For example, mangoes can have many shapes, sizes and colours. Learning from many pictures can help a computer recognize them. AI helps people do useful tasks; it does not replace human judgment.","A fruit packing centre receives many baskets every day. Workers need to sort mangoes and apples before packing them. A camera and an AI system could help recognize fruit on a moving belt. A worker can check uncertain answers before packing the fruit.",'machine',2,'A picture goes in. A prediction comes out. A person can check it.','Does AI think and feel exactly like people?',"No. Recognizing a fruit or answering a question does not prove that an AI feels hunger, happiness or sadness. It produces an answer using its design and learned information. People still decide how to use and check that answer.")]},
{title:'Instructions are not the same as learning',short:'Fixed rules',time:4,steps:[S('Q10 · What is a fixed rule?','A '+T('rule','fixed rule')+' is a written instruction. The machine follows it exactly, even if the instruction is incomplete.',"Imagine giving a student one instruction: put every yellow fruit into the mango basket. A yellow mango arrives, so the student follows the instruction and gets it right. A computer using that same fixed rule behaves in the same way.",'rule',0,'Yellow mango → correct answer','Why did the machine say mango?',"Because the instruction checks only whether the fruit is yellow. It does not check shape or other features. The answer happens to be correct for this mango, but the instruction may fail for other fruits."),S('Q11 · What if the fruit is green?','The machine follows the same instruction. It does not know that some mangoes are green.',"Now a green mango arrives at the sorting table. The rule says only yellow fruits are mangoes, so the computer rejects it. The fruit is actually a mango. The computer has not learned anything new; it simply follows the instruction it was given.",'rule',1,'Green mango → wrong answer','Can a fixed rule change by itself in this example?',"No. In this example the rule stays the same until a person edits it. It does not discover on its own that mangoes may be green. A trained AI model can instead use patterns learned from examples."),S('Q12 · What if a yellow fruit is an apple?','A yellow apple also matches the colour rule. Colour alone is not enough. Fixed rules are useful when the instructions are clear.',"A yellow apple arrives next. The fixed colour rule calls it a mango, which is wrong. The same kind of fixed instruction works well for a school bell: ring at 10 o’clock. That task has a clear rule and does not require learning from examples.",'rule',2,'Yellow apple → wrong answer','Is every machine that works automatically AI?',"No. A school bell with a timer and a basic calculator can work automatically using fixed instructions. An AI fruit recognizer is different because its model uses learned patterns to make a prediction.")]},
{title:'What information does a computer need?',short:'Data',time:4,steps:[S('Q13 · What is data?',' '+T('data')+' is information that a computer can use. Pictures, words, sounds and numbers can all be data.',"Imagine making a class album to teach a computer about fruit. Students take pictures of mangoes and apples in different colours and sizes. These pictures become data. If students also record the fruit names, those words are another kind of data.",'data',0,'Four pictures = four pieces of information','Is a voice recording also data?',"Yes. A recorded voice, a picture, a written sentence or a number can all be data. For example, a speech recognition system uses sound data to work out which words a person said."),S('Q14 · What is a label?','A '+T('label')+' is the correct name or answer attached to an example. It tells the computer what the picture represents.',"A teacher prepares two baskets of fruit pictures. She writes mango below the mango pictures and apple below the apple pictures. These names are labels. They help a learning system connect each example to the correct answer.",'label',1,'Picture + name = labelled example','What happens if a mango is labelled apple?',"If a mango picture is labelled apple, the learning system receives a wrong example. Repeated wrong labels can teach it misleading patterns. That is why checking the labels before training is important."),S('Q15 · What is a pattern?','A '+T('pattern')+' is a similarity that appears again and again. A '+T('feature')+' is a detail such as colour or shape.',"A student compares five mangoes and notices that many have a long, rounded shape even when their colours differ. He also notices that apples are often rounder. Shape and colour are features; the similarities across examples form useful patterns.",'pattern',2,'Look beyond colour: compare shape','Which is more useful here: colour alone or colour and shape?',"Colour and shape together are more useful here. A green mango and green apple share a colour, but their shapes differ. A yellow mango and yellow apple also share a colour. Looking at more than one feature can help.")]},
{title:'How can a machine learn?',short:'Learning',time:4,steps:[S('Q16 · Where does learning start?','Many AI systems start with examples. People collect information that can help the computer learn a task.',"A teacher wants a computer to recognize handwritten digits. She collects many examples of how students write 0 through 9 and gives each image the correct label. Different handwriting styles help provide the computer with useful examples.",'training',0,'Step 1 · Collect examples','Does an empty collection teach the computer fruit names?',"No. Without labelled examples, this particular fruit model has nothing to compare a new fruit with. It needs a collection containing useful examples before it can make a meaningful prediction."),S('Q17 · What is training?',' '+T('training')+' is the process of learning from examples. Many AI systems find useful patterns in the data.',"Imagine teaching a child to recognize dogs. You show small dogs, large dogs, black dogs and white dogs. The child notices similarities even when the dogs look different. During training, many AI systems also use examples to learn patterns that help with a task.",'training',1,'Step 2 · Learn from examples','Does learning always mean memorizing one picture?',"No. Memorizing one picture would not help much when a new picture looks different. Training aims to learn useful patterns across examples, so the model can make predictions on pictures it has not seen before."),S('Q18 · What happens after training?','A trained '+T('model')+' uses what it learned to answer a new question. Its answer is called a '+T('prediction')+'.',"After learning from many handwritten numbers, a digit recognition app receives a new picture of the number 7. The model uses what it learned to give its best answer. That answer is a prediction, even if it seems very certain.",'training',2,'Step 3 · Use what was learned','Can the model answer perfectly every time?',"No. A model might confuse a messy 7 with a 1, or mistake an unusual apple for a mango. Its prediction is based on what it learned, not a guarantee of truth. A person should check important results.")]},
{title:'Build a tiny fruit recognizer',short:'Experiment',time:5,steps:[S('Q19 · Teach by showing examples','Choose the correct label for each fruit. The small model stores its colour and shape with the name.',"Pretend you are the teacher of a tiny fruit-recognition system. Show it a yellow mango and save the correct name. Next, show it a red apple, a green mango and a green apple. Each correctly labelled example gives the model more information to compare.",'lab',0,'Add examples to the collection','Why add more than one mango?',"One yellow mango does not show that mangoes can also be green or orange. Adding different examples teaches the model that colour alone is not enough. The examples need correct labels and useful variety."),S('Q20 · Test a new fruit','Choose a fruit that was not in the training collection. The model compares its colour and shape with the stored examples.',"Imagine a new basket arriving after the computer has finished training. It contains an orange mango that was not in the earlier pictures. This is like a test after a lesson: we want to know whether the model can recognize something new.",'lab',1,'Test → compare → predict','Why test with new examples?',"Testing the same examples might only show that the model remembers them. New examples help us see whether it learned useful patterns that work outside the training collection. That is why testing matters."),S('Q21 · Compare the two approaches','The fixed rule checks only yellow colour. The trained model compares the new fruit with labelled examples.',"A yellow apple reaches a sorting table. A colour rule sends it to the mango basket. A trained model can compare its round shape with the apple examples it learned from. Try the two approaches yourself and see whether their predictions match the real fruit.",'lab',2,'Same fruit · two different approaches','Which approach worked better for this fruit?',"Look at the actual fruit and both answers. The colour rule makes a mistake on a yellow apple. With the full training collection, this small model can use shape as well as colour and identify it as apple. Other models or examples may still fail.")]},
{title:'AI can make mistakes',short:'Mistakes',time:5,steps:[S('Q22 · What if examples are missing?','A model trained only with mangoes has no apple examples to compare. It may call every fruit a mango.',"Imagine training a fruit app using only pictures of mangoes. Later, a student shows it an apple. Because the model has never been given an apple example, it may choose mango as the closest answer. It has not learned how to tell the two groups apart.",'mistake',0,'Incomplete examples → possible wrong answer','Why was the answer wrong?',"The collection contained mangoes but no apples. This small model can only choose from the names it has seen. Missing examples can cause mistakes when a new kind of object appears."),S('Q23 · How can learning improve?','Provide more useful, varied and correctly labelled examples. Then test again.',"A teacher sees that the fruit app keeps getting green apples wrong. She adds correctly labelled pictures of different apples and mangoes, then tests it on new pictures. She checks whether the new examples actually helped instead of assuming they did.",'mistake',1,'Add better examples and test again','Does adding examples guarantee a perfect AI?',"No. Useful and varied examples can improve a model, but it may still fail on unusual pictures, poor lighting or other situations. Testing on new examples is needed to see how much it improved."),S('Q24 · Should every AI answer be trusted?','AI can help people, but its answers need checking, especially when the answer matters.',"A school uses a program to read handwritten answers. It mistakes a student's 7 for a 1. If the teacher accepts the result without looking, the student may lose a mark unfairly. The teacher checks the original answer and corrects the mistake.",'predict',2,'Prediction → check the actual answer','Who should check an important AI answer?',"A responsible person should check important AI answers against the original information or a reliable source. For example, a teacher can check a handwritten answer before giving a mark. AI can assist, but its result is not proof.")]},
{title:'AI in everyday life',short:'Review',time:3,steps:[S('Q25 · Where is AI used?',"AI is already part of many everyday tools. It can help recognize a face, understand spoken words, sort unwanted messages, recognize fruit or find photos. Choose any of the five stories to see how the same basic idea works in different situations.","On the way to school, a student may unlock a phone with a face, use speech to type a message or search photos for a dog. At home, a mail app may sort spam. Explore five stories on the right to see what goes in, what AI does and what people should check.",'life',0,'Choose any of the five stories. Follow the picture, the AI model and the result.','Does every phone feature use AI?',"No. A basic alarm rings at the time you set, and a calculator follows arithmetic rules. Some phone features use AI to recognize patterns in pictures or speech, but being digital or automatic does not automatically make a feature AI."),S('Q26 · AI or not AI?','Look at how a tool works, not just whether it moves or works by itself.',"Imagine two school gates. One opens at exactly 8 o’clock using a timer. Another system tries to recognize registered faces from camera images. Both may work automatically, but only the second example uses a model for recognition. Think about what each system actually does.",'quiz',0,'Choose an answer, read the reason, then try the next example.','What is the main difference in this lesson?',"A fixed rule says exactly what to do when a condition is met. Many AI systems use patterns learned from data to make predictions about new information. Both can be useful, and neither needs to be called AI just because it works automatically.")]},

const trainingIds=[0,1,2,3];function nearest(i,ids){if(!ids.length)return null;return ids.map(j=>({j,d:Math.abs(F[i][3]-F[j][3])+2*Math.abs(F[i][4]-F[j][4])})).sort((a,b)=>a.d-b.d)[0].j;}
function compare(i,ids,showRule=false){let j=nearest(i,ids),actual=F[i][1];if(j===null)return '<div class="feedback">No examples yet. Add some training examples first.</div>';let guess=F[j][1],rule=F[i][3]?'mango':'not mango';return svg(fruit(i,40,72,1.15)+arrow(158,125,220,125)+group(picture(j,230,48,F[j][1]),'travel')+arrow(365,125,430,125)+group(box(440,56,205,137,'#f0f5ff','#2563eb')+text(542,87,'AI prediction',18)+text(542,129,guess.toUpperCase(),28,'#1548a6')+text(542,163,guess===actual?'Correct!':'Wrong!',22,guess===actual?'#13733b':'#b33225'),'fade delay'),'New fruit compared with closest learned example')+'<div class="feedback">'+(showRule?'<b>Colour rule:</b> '+rule+' · '+((rule==='mango')===(actual==='mango')?'correct':'wrong')+'<br>':'')+'<b>Trained model:</b> '+guess+' · <b>Actual fruit:</b> '+actual+' <span class="'+(guess===actual?'good':'bad')+'">'+(guess===actual?'✓ Correct':'✗ Mistake')+'</span><br><span class="muted">Closest example: '+F[j][0]+'. The model compares shape and colour.</span></div>';}
function lab(){let i=trainingIds[training.length];let gallery='<div class="train-grid" aria-label="Saved examples">'+(training.length?training.map(j=>'<div class="pop"><svg viewBox="0 0 100 110" aria-hidden="true">'+fruit(j)+'</svg>'+F[j][1]+'</div>').join(''):'<div>Empty collection</div>')+'</div>';if(step===0)return '<div class="mono meta">TRAINING COLLECTION · '+training.length+' / 4</div>'+gallery+(i!==undefined?svg(fruit(i,280,32,1.65)+text(330,238,'Choose the correct label',22),'Fruit to label')+'<div class="row">'+btn('teach','Mango','data-i="0"')+btn('teach','Apple','data-i="1"')+btn('reset','Reset')+'</div>':'<h2 class="good pop">Training collection complete!</h2><p>Four labelled examples are ready for testing.</p><div class="row">'+btn('advance','Test a new fruit','class="primary"')+btn('reset','Reset')+'</div>')+'<div id="feedback" class="feedback" aria-live="polite">'+(i!==undefined?'Choose a label for the fruit.':'Open the next step to test.')+'</div>';
return '<div class="mono meta">'+training.length+' SAVED EXAMPLES · CHOOSE A NEW FRUIT</div><div class="row">'+[4,5,6].map((i,j)=>tile(i,'test','Fruit '+(j+1))).join('')+'</div>'+(tested!==null?compare(tested,training,step===2):'<div class="feedback">Select a fruit to see the comparison and answer.</div>')+'<div class="row">'+btn('backtrain','Add examples')+btn('resettest','Clear result')+'</div><p class="muted">Simplified learning model: compares two pre-set features, not real photos.</p>';}
function mistakes(){const ids=step===0?[0,2]:[0,1,2,3];return '<div class="mono meta">'+(step===0?'ONLY MANGO EXAMPLES':'VARIED EXAMPLES')+'</div><div class="train-grid">'+ids.map(i=>'<div><svg viewBox="0 0 100 110" aria-hidden="true">'+fruit(i)+'</svg>'+F[i][1]+'</div>').join('')+'</div><div class="row">'+tile(5,'mistake','Test this fruit')+btn('clearMistake','Replay test')+'</div>'+(mistakeMode===step?compare(5,ids):'<div class="feedback">Tap the new fruit. Predict the result before checking.</div>');}

const quizzes=[["A school bell rings every day at 10 AM.",["AI","Not AI"],1,"A simple timer checks the clock and rings at the time a person set. It does not need to learn from examples. Automatic does not always mean AI."],["A computer learned to recognize mangoes from named examples.",["AI","Not AI"],0,"This system learned useful patterns from labelled fruit examples. When a new fruit picture arrives, it uses that learning to make a prediction. That is an example of AI."],["A calculator adds 2 + 3.",["AI","Not AI"],1,"An ordinary calculator follows mathematical instructions to get 5. It does not need training examples to learn addition for this task."],["A trained fruit recognizer gives a wrong answer. Is that possible?",["Yes","No"],0,"Yes. An unusual fruit or missing examples can lead to a wrong prediction. Check the result against the actual fruit instead of accepting every AI answer."],["A photo app finds dog pictures without you naming every photo.",["AI","Not AI"],0,"If it uses a trained model to recognize dogs in pictures, it is using AI for image recognition. Different dogs can look different, so learned patterns help the search."],["A phone alarm rings at the exact time you set.",["AI","Not AI"],1,"The alarm just follows the time you entered. Even if you used an AI voice assistant to set it, the alarm itself can work using a fixed instruction."]];
function quiz(){let q=quizzes[quizIndex];return '<div class="mono meta">CHECK '+(quizIndex+1)+' / '+quizzes.length+'</div><h2>'+q[0]+'</h2><div class="row">'+q[1].map((a,i)=>btn('quiz',a,'data-i="'+i+'" '+(quizChoice===i?'class="selected"':''))).join('')+'</div><div class="feedback" aria-live="polite">'+(quizChoice===null?'Choose an answer.':(quizChoice===q[2]?'<b class="good">Correct!</b> ':'<b class="bad">Not quite.</b> ')+q[3])+'</div>'+btn('quiznext',quizIndex===quizzes.length-1?'Start again':'Next example','class="primary" '+(quizChoice===null?'disabled':''));}
function stage(s){let content=s.kind==='lab'?lab():s.kind==='mistake'?mistakes():s.kind==='life'?lifeStage():s.kind==='quiz'?quiz():scene(s.kind,s.n);return '<div class="mono meta">VISUAL EXPLANATION</div>'+content+'<div class="cap">'+s.cap+'</div>';}
function notes(){return '<section class="notes"><div class="mono meta">DAY 01 · 10 MIN · ONE PAGE</div><h2>What is Artificial Intelligence?</h2><p><b>1. '+T('intelligence')+':</b> Ability to learn, understand and solve problems.</p><p><b>2. '+T('artificial')+':</b> Made by people. Example: a plastic mango.</p><p><b>3. '+T('AI','Artificial Intelligence (AI)')+':</b> Technology that helps computers do tasks that usually need human intelligence.</p><p><b>4. '+T('data')+':</b> Information such as pictures, words or sounds. A '+T('label','label')+' gives the correct name.</p><p><b>5. '+T('training')+':</b> Learning from examples. A '+T('prediction','prediction')+' is an answer based on learning.</p><table><thead><tr><th>Fixed rules</th><th>Learning from examples</th></tr></thead><tbody><tr><td>Follows given instructions.</td><td>Finds useful '+T('pattern','patterns')+' in data.</td></tr><tr><td>If yellow, say mango.</td><td>Learn from many named fruit pictures.</td></tr></tbody></table><p><b>Example:</b> A computer learns to recognize mangoes from different labelled pictures.</p><p><b>Remember:</b> AI can make mistakes. Not every automatic machine uses AI.</p></section>';}
function render(){let d=slides[page],s=d.steps[step];$('jump').innerHTML=slides.map((x,i)=>'<option value="'+i+'" '+(page===i?'selected':'')+'>'+String(i+1).padStart(2,'0')+' · '+x.short+'</option>').join('');$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('progress').textContent='Slide '+(page+1)+' / '+slides.length+' · '+slides.slice(0,page+1).reduce((a,b)=>a+b.time,0)+' / 45 min';$main.innerHTML='<div class="mono meta">FIG. '+String(page+1).padStart(2,'0')+' / '+slides.length+' · '+d.time+' MIN</div><h1>'+d.title+'</h1>'+(s?'<div class="steps" aria-label="Explanation steps">'+d.steps.map((a,i)=>'<button data-step="'+i+'" aria-current="'+(i===step)+'">'+a.h.split(' · ')[0]+' · '+(i+1)+'/'+d.steps.length+'</button>').join('')+'</div><div class="layout"><section class="panel copy"><div class="mono meta">EXPLANATION '+(step+1)+' / '+d.steps.length+'</div><h2>'+s.h+'</h2><p>'+s.p+'</p><div class="example"><b>Real-world example:</b> '+s.e+'</div><div class="controls">'+btn('replay','Replay animation')+btn('stepback','← Step',''+(step===0?'disabled':''))+btn('advance',step<d.steps.length-1?'Next explanation →':'Next slide →','class="primary"')+'</div></section><section class="panel stage" id="stage">'+stage(s)+'</section></div><div class="take"><b>Think together:</b><span>'+s.ask+' '+btn('reveal','Reveal why','aria-expanded="false"')+'</span></div><div class="reveal" id="answer" hidden><b>Answer explained:</b><p>'+s.answer+'</p></div>':notes());$main.scrollTop=0;}
function refresh(){let s=slides[page].steps[step];$('stage').innerHTML=stage(s)}function go(i){page=Math.max(0,Math.min(slides.length-1,i));step=0;render()}function advance(){if(step<slides[page].steps.length-1){step++;render()}else go(page+1)}
function glossary(k){let a=terms[k];$('word').textContent=a[0];$('meaning').textContent=a[1];$('example').textContent='Example: '+a[2];$('wordart').innerHTML=scene(a[3],a[3]==='clock'?0:2);if(!$('gloss').open)$('gloss').showModal();}function dictionary(){$('word').textContent='Tap a word';$('wordart').innerHTML='<div class="dictionary">'+Object.keys(terms).map(k=>T(k)).join('')+'</div>';$('meaning').textContent='';$('example').textContent='';if(!$('gloss').open)$('gloss').showModal();}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.word){glossary(b.dataset.word);return}if(b.dataset.step!==undefined){step=Number(b.dataset.step);render();return}let i=Number(b.dataset.i);switch(b.dataset.act){case'replay':refresh();break;case'stepback':if(step>0){step--;render()}break;case'advance':advance();break;case'reveal':{let a=$('answer');a.hidden=!a.hidden;b.setAttribute('aria-expanded',String(!a.hidden));b.textContent=a.hidden?'Reveal why':'Hide answer';if(!a.hidden)a.scrollIntoView({block:'nearest'});break}case'teach':{let j=trainingIds[training.length];if(j===undefined)break;if(F[j][1]!==['mango','apple'][i]){$('feedback').textContent='Not quite. Look at the fruit shape and choose its correct name.';break}training.push(j);refresh();$('feedback').textContent='Correct label saved! '+training.length+' / 4 examples.';break}case'reset':training=[];tested=null;refresh();break;case'backtrain':step=0;render();break;case'test':tested=i;refresh();break;case'resettest':tested=null;refresh();break;case'mistake':mistakeMode=step;refresh();break;case'clearMistake':mistakeMode=null;refresh();break;case'life':lifeChoice=i;refresh();break;case'quiz':quizChoice=i;refresh();break;case'quiznext':quizIndex=(quizIndex+1)%quizzes.length;quizChoice=null;refresh();break;}});
$('jump').onchange=e=>go(Number(e.target.value));$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('dictionary').onclick=dictionary;$('allwords').onclick=dictionary;$('close').onclick=()=>$('gloss').close();$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});};document.addEventListener('keydown',e=>{if($('gloss').open||['SELECT','BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1);if(e.key===' '){e.preventDefault();advance()}if(e.key==='/')location.href='../';});render();
</script></body></html>
