<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>/ai studies — What is AI?</title><meta name="description" content="Discover artificial intelligence by teaching a computer to recognize mangoes."><meta name="lab-formula" content="Examples → learning → prediction"><style>
*{box-sizing:border-box}body{margin:0;color:#111;background:white;font:20px system-ui,sans-serif}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;border-bottom:1px solid #ddd;font:14px ui-monospace,monospace}footer{border-top:1px solid #ddd;border-bottom:0}a{color:inherit}#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}main{overflow:auto;padding:clamp(16px,3vw,42px);background-image:linear-gradient(#f5f5f5 1px,transparent 1px),linear-gradient(90deg,#f5f5f5 1px,transparent 1px);background-size:32px 32px}h1{font-size:clamp(32px,4vw,58px);letter-spacing:-.045em;margin:0 0 12px;font-weight:550}h2{font-size:25px;margin:0 0 10px}p{margin:8px 0;line-height:1.45}button{font:inherit;color:inherit;background:white;border:1px solid #ccc;padding:10px 16px;cursor:pointer}button:hover,button:focus-visible{border-color:#2563eb;outline:2px solid #2563eb;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.primary{background:#2563eb;color:white;border-color:#2563eb}.term{border:0;border-bottom:2px dotted #2563eb;color:#1749b5;padding:0;background:transparent;font-weight:600}.layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.5fr);gap:24px;align-items:start}.panel{background:white;border:1px solid #ddd;padding:20px}.stage{min-height:290px;display:grid;align-content:center;gap:14px;text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}.fruit{width:100px;height:110px;vertical-align:middle}.tile{display:grid;justify-items:center;gap:4px;min-width:110px}.tile small{font-size:15px}.answer{margin-top:12px;padding:12px;border-left:4px solid #2563eb;background:#f0f5ff}.muted{color:#555;font-size:16px}.kicker{font:14px ui-monospace,monospace;color:#555;margin-bottom:12px}.question{margin:12px 0}.question button{width:100%;text-align:left}.meter{height:5px;background:#eee}.meter span{display:block;height:100%;background:#2563eb;transition:width .3s}.flow{font-size:30px;color:#2563eb;animation:pulse 1.2s infinite alternate}.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.88);opacity:.3}to{transform:scale(1);opacity:1}}@keyframes pulse{to{opacity:.35;transform:translateX(5px)}}dialog{max-width:min(520px,90vw);border:1px solid #aaa;padding:25px;color:#111}dialog::backdrop{background:#0005}dialog h2{font-size:32px}.notes{max-width:950px;margin:auto;background:white;padding:20px;border:1px solid #ddd}.notes p{font-size:21px}.notes table{border-collapse:collapse;width:100%;font-size:19px}.notes td,.notes th{border:1px solid #ddd;padding:8px;text-align:left}.good{color:#16743a}.bad{color:#b72c22}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{font:14px monospace;padding:7px 10px}nav button[aria-current=true]{background:#111;color:white}#status{min-height:48px} @media(max-width:760px){.layout{grid-template-columns:1fr}header,footer{flex-wrap:wrap;padding:8px}main{padding:16px}.fruit{width:75px;height:85px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><header><a href="../">/ ai studies</a><span>DAY 01 · 30 MIN</span><nav id="nav" aria-label="Lesson pages"></nav><button id="full">Full screen</button></header><main id="main"></main><footer><button id="prev">← Previous</button><span id="progress"></span><button class="primary" id="next">Next →</button></footer></div><dialog id="gloss"><h2 id="word"></h2><p id="meaning"></p><p id="example"></p><button id="close">Close ×</button></dialog>
<script>
const $=id=>document.getElementById(id);
const vocab={intelligence:['Ability to learn, understand and solve problems.','Recognizing a mango even when it is green.'],artificial:['Made by people, not by nature.','A plastic mango is artificial.'],AI:['Artificial Intelligence: technology that helps computers do tasks that usually need human intelligence.','A computer recognizing a mango in a picture.'],computer:['A machine that follows instructions and processes information.','A phone is a small computer.'],rule:['An instruction that tells a machine what to do.','IF a fruit is yellow, call it a mango.'],data:['Information a computer can use.','Pictures of mangoes and apples are data.'],label:['The correct name or answer attached to an example.','A picture marked “mango”.'],pattern:['A feature or similarity that appears again and again.','Many mangoes have an oval shape.'],training:['Helping a computer learn from examples.','Showing it several named fruit pictures.'],prediction:['An answer based on what has been learned.','The computer guesses “mango” for a new picture.'],model:['The result of learning that a computer uses to make predictions.','A fruit recognizer that has learned from examples.']};
const t=(key,display=key)=>'<button class="term" data-word="'+key+'">'+display+'</button>';
const fruits=[{name:'Yellow mango',kind:'mango',color:'#f5b82e',shape:'mango',x:[1,1]},{name:'Red apple',kind:'apple',color:'#df5549',shape:'apple',x:[0,0]},{name:'Green mango',kind:'mango',color:'#8aaf45',shape:'mango',x:[0,1]},{name:'Green apple',kind:'apple',color:'#8aaf45',shape:'apple',x:[0,0]},{name:'Orange mango',kind:'mango',color:'#f08c38',shape:'mango',x:[1,1]},{name:'Yellow apple',kind:'apple',color:'#f5b82e',shape:'apple',x:[1,0]}];
function art(i){let f=fruits[i];return '<svg class="fruit" viewBox="0 0 100 110" role="img" aria-label="'+f.name+'"><path d="'+(f.shape==='mango'?'M60 19 C94 24 90 70 59 94 C34 111 9 83 17 56 C23 34 37 17 60 19Z':'M50 31 C18 7 4 43 17 75 C28 102 43 97 50 91 C65 106 84 91 91 65 C100 32 74 14 50 31Z')+'" fill="'+f.color+'" stroke="#333" stroke-width="1.5"/><path d="M52 29 Q49 12 58 7" fill="none" stroke="#61462b" stroke-width="5"/><path d="M55 17 Q76 0 87 12 Q73 26 55 17" fill="#548c42"/><path d="M31 39 Q21 53 26 66" fill="none" stroke="white" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/></svg>'}
function tile(i,action,label=fruits[i].name){return '<button class="tile" data-act="'+action+'" data-i="'+i+'">'+art(i)+'<small>'+label+'</small></button>'}
const q=(n,question,answer)=>'<div class="question"><button aria-expanded="false" data-reveal>Q'+String(n).padStart(2,'0')+' · '+question+' <span aria-hidden="true">＋</span></button><div class="answer" hidden>'+answer+'</div></div>';
const pages=['Notice','Meaning','Rules','Teach','Test','Check','Notebook'];const times=[2,3,3,5,4,3,10];let page=0,examples=[],selected=0,quiz=0;
function panel(left,right){return '<div class="layout"><section class="panel">'+left+'</section><section class="panel stage">'+right+'</section></div>'}
function render(){let body='';
if(page===0)body=panel('<h2>Look at the fruit.</h2>'+q(1,'Are both fruits mangoes?','Yes. Mangoes can be different colours.')+q(2,'How can a person tell?','By remembering what mangoes look like. This is part of '+t('intelligence')+'.'),'<div class="row">'+tile(0,'notice','Fruit A')+tile(2,'notice','Fruit B')+'</div><p id="status" aria-live="polite">Tap a fruit to reveal its name.</p>');
if(page===1)body=panel(q(3,'What is intelligence?',t('intelligence','Intelligence')+' means being able to learn, understand and solve problems.')+q(4,'What is artificial?',t('artificial','Artificial')+' means made by people.')+q(5,'What is AI?',t('AI','Artificial Intelligence (AI)')+' helps computers do tasks that usually need human intelligence.'),'<div class="row"><div>'+art(0)+'<p>Person recognizes fruit</p></div><span class="flow">→</span><div><svg width="130" height="110" viewBox="0 0 130 110"><rect x="8" y="8" width="114" height="78" rx="3" fill="#f0f5ff" stroke="#2563eb" stroke-width="3"/><path d="M65 86v14m-30 0h60" stroke="#111" stroke-width="4"/><text x="65" y="53" text-anchor="middle" font-size="24" fill="#2563eb">AI</text></svg><p>Computer recognizes fruit</p></div></div><button data-act="why">Why use AI?</button><p id="status" aria-live="polite"></p>');
if(page===2)body=panel(q(6,'What is a fixed rule?','A '+t('rule')+' is an instruction. Here: IF yellow, THEN mango.')+q(7,'What can go wrong?','A green mango is still a mango. A simple colour rule misses it.'),'<h2>Rule machine</h2><p>IF yellow → mango. Otherwise → not mango.</p><div class="row">'+[0,2,5].map(i=>tile(i,'rule')).join('')+'</div><p id="status" aria-live="polite">Choose a fruit to test the rule.</p>');
if(page===3)body=panel(q(8,'What is data?',t('data','Data')+' is information, such as fruit pictures.')+q(9,'What is a label?','A '+t('label')+' tells the correct name of a picture.')+q(10,'How does AI learn?','During '+t('training')+', many AI systems use examples to find '+t('pattern','patterns')+'.'),'<h2>Teach the fruit recognizer</h2><div class="row">'+art(selected)+'</div><p>Choose the correct name.</p><div class="row"><button data-act="teach" data-i="0">Mango</button><button data-act="teach" data-i="1">Apple</button><button data-act="reset">Reset</button></div><div class="meter"><span id="bar" style="width:'+examples.length*25+'%"></span></div><p id="status" aria-live="polite">'+examples.length+' / 4 examples learned</p><p class="muted">Teaching model: uses colour and shape, not real photo recognition.</p>');
if(page===4)body=panel(q(11,'What is a prediction?','A '+t('prediction')+' is an answer based on what was learned.')+q(12,'Can AI make mistakes?','Yes. Missing or misleading examples can cause wrong answers.'),'<h2>Test new fruit</h2><div class="row">'+[4,5].map(i=>tile(i,'test')).join('')+'</div><p id="status" aria-live="polite">'+(examples.length?'Choose a new fruit.':'Complete the teaching activity first.')+'</p><button data-act="backteach">Return to training</button><p class="muted">This small '+t('model')+' compares colour and shape with learned examples.</p>');
if(page===5)body=panel('<h2>Check understanding</h2><p>Choose an answer. Explain the reason aloud.</p><p id="score" aria-live="polite"></p>','<h2 id="quizq"></h2><div id="choices" class="row"></div><p id="status" aria-live="polite"></p><button data-act="quiznext">Next question</button>');
if(page===6)body='<section class="notes"><h2>What is AI? · Notebook</h2><p><b>1. '+t('intelligence','Intelligence')+':</b> Ability to learn, understand and solve problems.</p><p><b>2. '+t('artificial','Artificial')+':</b> Made by people.</p><p><b>3. '+t('AI','AI')+':</b> Technology that helps computers do tasks that usually need human intelligence.</p><p><b>4. '+t('data','Data')+':</b> Information, such as fruit pictures. A '+t('label')+' gives the correct name.</p><p><b>5. '+t('training','Training')+':</b> Learning from examples. A '+t('prediction')+' is an answer based on learning.</p><table><tr><th>Fixed rules</th><th>Learning from examples</th></tr><tr><td>Follows given instructions.</td><td>Finds patterns in data.</td></tr><tr><td>Yellow = mango.</td><td>Learns from many fruit pictures.</td></tr></table><p><b>Remember:</b> AI can make mistakes. Not every automatic machine uses AI.</p></section>';
$('main').innerHTML='<div class="kicker">FIG. '+String(page+1).padStart(2,'0')+' · '+times[page]+' MIN</div><h1>'+['Can a computer recognize a mango?','What is AI?','Following instructions','Learning from examples','Can AI recognize new fruit?','AI or not?','Write in the notebook'][page]+'</h1>'+body;$('main').scrollTop=0;$('progress').textContent=(page+1)+' / 7 · '+times.slice(0,page+1).reduce((a,b)=>a+b,0)+' / 30 min';$('prev').disabled=page===0;$('next').disabled=page===6;$('nav').innerHTML=pages.map((p,i)=>'<button data-page="'+i+'" aria-current="'+(i===page)+'">'+(i+1)+' '+p+'</button>').join('');if(page===5)showQuiz();}
const quizzes=[['Q13 · A machine follows only a colour rule. Is that AI?',['Yes','No'],1,'A simple fixed rule does not learn.'],['Q14 · What helps this fruit AI learn?',['Named fruit pictures','A bigger screen'],0,'Pictures and correct labels provide examples.'],['Q15 · Can AI give a wrong answer?',['Yes','Never'],0,'AI can make mistakes.']];
let answered=false;function showQuiz(){answered=false;let z=quizzes[quiz];$('quizq').textContent=z[0];$('choices').innerHTML=z[1].map((s,i)=>'<button data-act="quiz" data-i="'+i+'">'+s+'</button>').join('');$('status').textContent='';$('score').textContent='Question '+(quiz+1)+' of 3';}
function status(s){let el=$('status');el.innerHTML=s;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function go(n){page=Math.max(0,Math.min(6,n));render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.word){let k=b.dataset.word;$('word').textContent=k==='AI'?'Artificial Intelligence (AI)':k;$('meaning').textContent=vocab[k][0];$('example').textContent='Example: '+vocab[k][1];$('gloss').showModal();return}if(b.hasAttribute('data-reveal')){let a=b.nextElementSibling;a.hidden=!a.hidden;b.setAttribute('aria-expanded',String(!a.hidden));b.lastElementChild.textContent=a.hidden?'＋':'−';return}if(b.dataset.page!==undefined){go(+b.dataset.page);return}let i=+b.dataset.i;switch(b.dataset.act){case'notice':status(fruits[i].name+' — both are mangoes.');break;case'why':status('Some tasks are hard to explain with simple rules. AI can help recognize things from examples.');break;case'rule':{let guess=fruits[i].x[0]?'mango':'not mango';status('Rule says: <b>'+guess+'</b>. Actual: '+fruits[i].kind+'. '+((guess==='mango')===(fruits[i].kind==='mango')?'Correct.':'<span class="bad">Mistake!</span>'));break}case'teach':{if(examples.length===4){status('Training complete. Open Test.');break}let f=fruits[selected],label=i===0?'mango':'apple';if(label!==f.kind){status('Try again. Look at the fruit shape.');break}examples.push({x:f.x,label});selected=Math.min(3,examples.length);render();status(examples.length===4?'Training complete! Open Test.':examples.length+' / 4 examples learned. Correct label!');break}case'reset':examples=[];selected=0;render();break;case'test':{if(!examples.length){status('No examples yet. Return to training.');break}let f=fruits[i];let nearest=examples.slice().sort((a,b)=>dist(a.x,f.x)-dist(b.x,f.x))[0];status('AI predicts: <b>'+nearest.label+'</b>. Actual: '+f.kind+'. '+(nearest.label===f.kind?'<span class="good">Correct!</span>':'<span class="bad">Mistake!</span>'));break}case'backteach':go(3);break;case'quiz':{let z=quizzes[quiz];answered=true;status((i===z[2]?'Correct. ':'Not quite. ')+z[3]);break}case'quiznext':if(!answered){status('Choose an answer first.');break}if(quiz===2){go(6);break}quiz++;showQuiz();break;}});
function dist(a,b){return Math.abs(a[0]-b[0])+2*Math.abs(a[1]-b[1])}
$('close').onclick=()=>$('gloss').close();$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{});};document.addEventListener('keydown',e=>{if($('gloss').open)return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1);if(e.key==='/')location.href='../'});render();
</script></body></html>
