.copy .example{font-size:clamp(16px,1.43vw,20px);line-height:1.55}

/* Motion player: consistent large graphics and bounded, controllable playback. */

'use strict';const $=id=>document.getElementById(id);const terms={intelligence:['Intelligence','The ability to learn, understand and solve problems.','A child recognizes a green mango after seeing other mangoes.','human'],artificial:['Artificial','Made by people rather than produced by nature.','A plastic mango is artificial; a mango growing on a tree is natural.','natural'],AI:['Artificial Intelligence (AI)','Technology that allows computers to perform tasks that usually need human intelligence.','A computer identifies fruit in a picture.','machine'],computer:['Computer','A machine that follows instructions and works with information.','A phone is a small computer.','machine'],rule:['Fixed rule','An instruction that says exactly what to do.','If the fruit is yellow, call it a mango.','rule'],data:['Data','Information that a computer can use. It can be pictures, words, numbers or sounds.','Pictures of four fruits are data.','data'],label:['Label','The name or correct answer attached to an example.','A picture marked “mango” has a label.','label'],pattern:['Pattern','A feature or similarity that appears repeatedly.','Many mangoes have a similar oval shape even when colours differ.','pattern'],training:['Training','The process of learning from examples.','Showing a computer different named fruit pictures.','training'],model:['Model','The result of learning that a computer uses to make an answer.','A fruit recognizer that compares new fruit with learned examples.','machine'],prediction:['Prediction','An answer or guess based on information already learned.','The computer says “mango” when it sees a new fruit.','predict'],automatic:['Automatic','Something that works by itself after being set up.','A school bell rings at a set time without anyone pressing it.','clock'],feature:['Feature','A detail that helps describe something.','The colour and shape of a fruit are two features.','pattern']};
const T=(k,s=terms[k][0])=>'<button class="term" data-word="'+k+'">'+s+'</button>';const F=[['Yellow mango','mango','#edb72d',1,1],['Red apple','apple','#df5549',0,0],['Green mango','mango','#89af4d',0,1],['Green apple','apple','#89af4d',0,0],['Orange mango','mango','#ed9140',0,1],['Yellow apple','apple','#edb72d',1,0],['Dark green mango','mango','#4d8a3c',0,1]];

{title:'How do people recognize things?',short:'Intelligence',steps:[S('Q01 · What is intelligence?','A person can learn, understand and solve problems. This ability is called '+T('intelligence')+'.',"Aarav borrows Kabir's bicycle and falls off balance on his first try. Kabir teaches Aarav to look ahead, pedal slowly and steer. After practising in the playground, Aarav can ride along a new path without help.",'human',0,'Look at the fruit. What is it?',"Why can Aarav ride along a new path?","Aarav has learned how to balance and steer rather than memorising one path. He can use those skills somewhere new."),S('Q02 · How does learning help?','People learn by seeing, hearing and practising. Remembered examples help with new situations.',"Meera goes to a market in Sangli with Grandma Lata. Lata shows Meera a yellow mango and then a green mango. Meera notices their similar shape and recognises an orange mango the next week without asking Lata.",'human',1,'See → remember → recognize',"Why can Meera recognise the orange mango?","Meera remembers useful details such as shape from earlier examples. She does not rely on colour alone."),S("Q03 · Can the same kind of fruit look different?",'A green mango and a yellow mango look different, but both are mangoes. Intelligence helps recognize similarities.',"Riya arrives at a new school. Teacher Anita explains that the library is next to the stairs and the classroom is opposite it. The next morning Riya uses those landmarks to reach the room by herself.",'human',2,'Different colour. Same fruit.',"Is Riya simply copying Anita's exact footsteps?","No. Riya understands where the landmarks are. She can use that information even if she starts from a different entrance.")]},
{title:'Natural or artificial?',short:'Artificial',steps:[S('Q04 · What is natural?','Something produced by nature, rather than made by people, is natural.',"Isha waters a mango tree with Grandpa Mohan. Flowers appear and fruits grow over time. At a shop, Isha sees a plastic mango that looks similar but cannot grow or ripen.",'natural',0,'A real mango grows on a tree.',"Why is the plastic mango artificial?","People made the plastic mango to look like fruit. A natural mango is produced by a living tree."),S('Q05 · What is artificial?','Something made by people is called '+T('artificial')+'. It can look like something natural.',"Kabir studies a fallen flower in the garden. In art class, teacher Pooja helps Kabir fold coloured paper into a flower. The paper flower looks bright, but it needs no sunlight or water.",'natural',1,'Real fruit and a man-made fruit',"Does looking like a flower make it natural?","No. The paper flower is made by people. Its appearance does not change how it was produced."),S('Q06 · Why use this word in AI?','Artificial intelligence is made by people. It is not the natural intelligence of a person or animal.',"Grandpa Ramesh has difficulty hearing quiet speech. Ananya learns how a hearing aid makes sounds easier to hear. Some modern hearing aids can also use trained models to help separate speech from background noise.",'natural',2,'Natural intelligence ≠ artificial intelligence',"Is every hearing aid AI?","No. Basic hearing aids can amplify sound using ordinary electronics. Some newer ones use trained models to help separate speech from noise.")]},
{title:'What is artificial intelligence?',short:'AI',steps:[S('Q07 · What can a person do?','Recognizing objects, understanding words and solving problems are tasks that can require human intelligence.',"Before school, Aditi looks at her phone instead of entering a passcode. An AI-based face recognition system compares facial features with information saved during setup. If the match is strong enough, the phone unlocks; in poor light Aditi may need her passcode.",'machine',0,'Human recognizes a mango.',"Does the phone think exactly like Aditi?","No. It performs a specific recognition task using a model and data. That does not mean it has Aditi's feelings or human understanding."),S('Q08 · What is AI?',T('AI')+' is technology that helps '+T('computer','computers')+' do tasks that usually need human intelligence. For example, AI can recognize objects in pictures, turn speech into words or help answer a question. Many AI systems learn from examples and use what they learned on new information.',"Arjun has flour on his hands while helping Papa Vikram make rotis. Arjun says, “Set a timer for five minutes.” The phone recognises his spoken words, identifies the request and starts a timer. Arjun checks the displayed time.",'machine',1,'Photo → AI model → predicted name',"Which part of the task uses AI?","A trained speech model can identify the words from sound. The timer itself can count down using ordinary instructions."),S('Q09 · Why make AI?',"We use AI when a task is difficult to describe with a few simple instructions. For example, mangoes can have many shapes, sizes and colours. Learning from many pictures can help a computer recognize them. AI helps people do useful tasks; it does not replace human judgment.","Kavya wants to show a picture of her dog Bruno to a classmate. Kavya searches dog in a photo app with image search. The app finds likely dog pictures among hundreds of family photos, and Kavya chooses the correct one.",'machine',2,'A picture goes in. A prediction comes out. A person can check it.',"Why might the app show a wrong photo?","A model may confuse similar patterns or miss a partly hidden dog. Kavya must check the results.")]},

{title:'Build a tiny fruit recognizer',short:'Experiment',steps:[S('Q19 · Teach by showing examples','Choose the correct label for each fruit. The small model stores its colour and shape with the name.',"Aarohi opens the fruit lab before adding examples. The lab asks for training data when Aarohi tries to test a fruit. Aarohi saves one correctly labelled mango, but the model still has no information about apples.",'lab',0,'Add examples to the collection',"Can this empty model recognise fruit reliably?","No. It has nothing saved to compare. A real app may already be trained, but this particular lab starts empty."),S('Q20 · Test a new fruit','Choose a fruit that was not in the training collection. The model compares its colour and shape with the stored examples.',"Rudra sees a red apple in the fruit lab and accidentally selects mango. The lab asks Rudra to look again instead of saving the wrong label. Rudra selects apple, and the example enters the collection.",'lab',1,'Test → compare → predict',"Why does the lab ask Rudra to correct the label?","A wrong label would give misleading information. The lab checks labels to help students learn why accurate training data matters."),S('Q21 · Compare the two approaches','The fixed rule checks only yellow colour. The trained model compares the new fruit with labelled examples.',"Avni notices a yellow mango is already saved in the model. Avni adds a green mango and compares it with a green apple. Although the fruits share a colour, their shapes are different.",'lab',2,'Same fruit · two different approaches',"Why not train with yellow mangoes only?","Mangoes may be green or orange too. Varied data can help a model avoid depending on one colour.")]},

function lab(){let i=trainingIds[training.length];let gallery='<div class="train-grid" aria-label="Saved examples">'+(training.length?training.map(j=>'<div class="pop"><svg viewBox="0 0 100 110" aria-hidden="true">'+fruit(j)+'</svg>'+F[j][1]+'</div>').join(''):'<div>Empty collection</div>')+'</div>';if(step===0)return '<div class="mono meta">TRAINING COLLECTION · '+training.length+' / 4</div>'+gallery+(i!==undefined?motionSvg(phase(0,fruitCard(20,i,'01 · EXAMPLE',F[i][0].split(' ')[0]+' fruit','Look at its shape'))+flow(194,137,240,137,1200,2300)+phase(2000,processCard(240,'02 · OBSERVE','Shape + colour','Choose the correct name',fruitMini(i,297,96,.65)))+phase(4800,cardArt(466,49,174,185,'03 · YOUR TURN','Add a label',mr(499,106,108,52,'#eaf1ff','#8eb1ef')+mt(553,139,'Mango or apple?',12,motionBlue,650),'Use the buttons below')),['Observe the new fruit','Look at its shape and colour','Choose its correct label below'],'Observe a fruit and choose its label')+'<div class="row">'+btn('teach','Mango','data-i="0"')+btn('teach','Apple','data-i="1"')+btn('reset','Reset')+'</div>':'<h2 class="good pop">Training collection complete!</h2><p>Four labelled examples are ready for testing.</p><div class="row">'+btn('advance','Test a new fruit','class="primary"')+btn('reset','Reset')+'</div>')+'<div id="feedback" class="feedback" aria-live="polite">'+(i!==undefined?'Choose a label for the fruit.':'Open the next step to test.')+'</div>';

function mistakes(){const ids=step===0?[0,2]:[0,1,2,3];return '<div class="mono meta">'+(step===0?'ONLY MANGO EXAMPLES':'VARIED EXAMPLES')+'</div><div class="train-grid">'+ids.map(i=>'<div><svg viewBox="0 0 100 110" aria-hidden="true">'+fruit(i)+'</svg>'+F[i][1]+'</div>').join('')+'</div><div class="row">'+tile(5,'mistake','Test this fruit')+btn('clearMistake','Clear test')+'</div>'+(mistakeMode===step?compare(5,ids):'<div class="feedback">Tap the new fruit. Predict the result before checking.</div>');}

const quizzes=[["A school bell rings every day at 10 AM.",["AI","Not AI"],1,"A simple timer checks the clock and rings at the time a person set. It does not need to learn from examples. Automatic does not always mean AI."],["A computer learned to recognize mangoes from named examples.",["AI","Not AI"],0,"This system learned useful patterns from labelled fruit examples. When a new fruit picture arrives, it uses that learning to make a prediction. That is an example of AI."],["A calculator adds 2 + 3.",["AI","Not AI"],1,"An ordinary calculator follows mathematical instructions to get 5. It does not need training examples to learn addition for this task."],["A trained fruit recognizer gives a wrong answer. Is that possible?",["Yes","No"],0,"Yes. An unusual fruit or missing examples can lead to a wrong prediction. Check the result against the actual fruit instead of accepting every AI answer."],["A photo app finds dog pictures without you naming every photo.",["AI","Not AI"],0,"If it uses a trained model to recognize dogs in pictures, it is using AI for image recognition. Different dogs can look different, so learned patterns help the search."],["A phone alarm rings at the exact time you set.",["AI","Not AI"],1,"The alarm just follows the time you entered. Even if you used an AI voice assistant to set it, the alarm itself can work using a fixed instruction."]];

/* One animation controller, cancelled whenever the scene changes. */
let activeMotion=null,motionRaf=0,motionSpeed=1;
const clamp01=v=>Math.max(0,Math.min(1,v));
const easeMotion=v=>v*v*(3-2*v);
function stopMotion(){if(motionRaf&&typeof cancelAnimationFrame==='function')cancelAnimationFrame(motionRaf);motionRaf=0;activeMotion=null;}
function motionControls(){
 return '<div class="motion-controls" aria-label="Animation playback"><div class="motion-phase-list"><span data-phase="0">01 · INPUT</span><span data-phase="1">02 · PROCESS</span><span data-phase="2">03 · RESULT</span></div><div class="motion-now" id="motion-now" aria-live="off"></div><input id="motion-seek" type="range" min="0" max="'+MOTION_END+'" step="50" value="0" aria-label="Animation timeline"><div class="motion-actions"><button type="button" data-act="motionpause" id="motion-pause" aria-label="Pause animation">Pause</button><button type="button" data-act="motionrestart">Replay</button><button type="button" data-act="motionspeed" id="motion-speed" aria-label="Change playback speed">'+motionSpeed+'× speed</button><span id="motion-time" class="mono">0.0 / 7.2 s</span></div></div>';
}
function paintMotion(m,t){
 m.time=Math.max(0,Math.min(MOTION_END,t));
 const p=m.time;
 m.layers.forEach(({el,at,span,mode})=>{
  const f=easeMotion(clamp01((p-at)/span));
  el.setAttribute('opacity',String(f));el.setAttribute('transform',mode==='rise'?'translate(0 '+((1-f)*9).toFixed(2)+')':'translate(0 0)');
 });
 m.paths.forEach(({el,coords,from,to,scan})=>{
  const f=clamp01((p-from)/(to-from)),on=p>=from&&p<to,alpha=on?Math.min(1,f*8,(1-f)*8):0;
  el.setAttribute('opacity',String(alpha));
  if(scan)el.setAttribute('transform','translate(0 '+(coords[3]*f).toFixed(2)+')');
  else el.setAttribute('transform','translate('+(coords[0]+(coords[2]-coords[0])*f).toFixed(2)+' '+(coords[1]+(coords[3]-coords[1])*f).toFixed(2)+')');
 });
 const i=p<2400?0:p<4900?1:2;
 if(m.phase!==i){
  m.phase=i;
  m.phaseNodes.forEach((el,k)=>{el.classList.toggle('motion-current',k===i);el.classList.toggle('motion-done',k<i)});
  if(m.now)m.now.textContent=m.labels[i]||'';
 }
 if(m.seek){m.seek.value=String(Math.round(p/50)*50);m.seek.setAttribute('aria-valuetext',(p/1000).toFixed(1)+' seconds: '+m.labels[i]);}
 if(m.timeLabel)m.timeLabel.textContent=(p/1000).toFixed(1)+' / '+(MOTION_END/1000).toFixed(1)+' s';
 if(m.feedback)m.feedback.classList.toggle('motion-waiting',p<5400);
}
function motionButton(m){if(!m.pause)return;m.pause.textContent=m.playing?'Pause':m.time>=MOTION_END?'Play again':'Play';m.pause.setAttribute('aria-label',m.playing?'Pause animation':m.time>=MOTION_END?'Play animation again':'Resume animation');}
function queueMotion(m){if(motionRaf||!m.playing||typeof requestAnimationFrame!=='function')return;motionRaf=requestAnimationFrame(ts=>{motionRaf=0;if(activeMotion!==m||!m.playing)return;const dt=m.last===null?0:Math.min(100,ts-m.last);m.last=ts;paintMotion(m,m.time+dt*motionSpeed);if(m.time>=MOTION_END){m.playing=false;motionButton(m);}else queueMotion(m);});}
function pauseMotion(m){m.playing=false;m.last=null;if(motionRaf&&typeof cancelAnimationFrame==='function')cancelAnimationFrame(motionRaf);motionRaf=0;motionButton(m);}
function playMotion(m,reset=false){if(!m)return;if(reset||m.time>=MOTION_END)paintMotion(m,0);m.last=null;m.playing=true;motionButton(m);queueMotion(m);}
function mountMotion(){
 stopMotion();const host=$('stage');if(!host||!host.querySelector)return;
 const art=host.querySelector('.motion-scene');if(!art)return;
 const reduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 const m={time:0,last:null,playing:false,phase:-1,labels:JSON.parse(art.dataset.phases),layers:[...art.querySelectorAll('[data-enter]')].map(el=>({el,at:Number(el.dataset.enter),span:Number(el.dataset.span),mode:el.dataset.mode})),paths:[...art.querySelectorAll('[data-path],[data-scan]')].map(el=>({el,coords:(el.dataset.path||el.dataset.scan).split(',').map(Number),from:Number(el.dataset.from),to:Number(el.dataset.to),scan:!!el.dataset.scan})),phaseNodes:[...host.querySelectorAll('[data-phase]')],now:host.querySelector('#motion-now'),seek:host.querySelector('#motion-seek'),timeLabel:host.querySelector('#motion-time'),pause:host.querySelector('#motion-pause'),feedback:host.querySelector('.motion-feedback'),reduced};
 activeMotion=m;
 paintMotion(m,reduced?MOTION_END:0);
 if(m.seek)m.seek.addEventListener('input',()=>{pauseMotion(m);paintMotion(m,Number(m.seek.value));motionButton(m);});
 if(reduced)motionButton(m);else playMotion(m);
}
function replayMotion(){if(activeMotion){if(activeMotion.reduced){pauseMotion(activeMotion);paintMotion(activeMotion,MOTION_END);motionButton(activeMotion);}else playMotion(activeMotion,true);}else refresh();}
function toggleMotion(){const m=activeMotion;if(!m)return;if(m.playing)pauseMotion(m);else if(m.reduced){paintMotion(m,m.time>=MOTION_END?0:MOTION_END);motionButton(m);}else playMotion(m);}
function speedMotion(){motionSpeed=motionSpeed===1?.5:motionSpeed===.5?1.5:motionSpeed===1.5?2:1;const b=$('motion-speed');if(b)b.textContent=motionSpeed+'× speed';}

function stage(s){let content=s.kind==='lab'?lab():s.kind==='mistake'?mistakes():s.kind==='life'?lifeStage():s.kind==='quiz'?quiz():scene(s.kind,s.n);return '<div class="mono meta">VISUAL EXPLANATION</div>'+content+(content.includes('motion-scene')?motionControls():'')+'<div class="cap">'+s.cap+'</div>';}
function notes(){return '<section class="notes"><div class="mono meta">NOTEBOOK · REVIEW</div><h2>What is Artificial Intelligence?</h2><p><b>1. '+T('intelligence')+':</b> Ability to learn, understand and solve problems.</p><p><b>2. '+T('artificial')+':</b> Made by people. Example: a plastic mango.</p><p><b>3. '+T('AI','Artificial Intelligence (AI)')+':</b> Technology that helps computers do tasks that usually need human intelligence.</p><p><b>4. '+T('data')+':</b> Information such as pictures, words or sounds. A '+T('label','label')+' gives the correct name.</p><p><b>5. '+T('training')+':</b> Learning from examples. A '+T('prediction','prediction')+' is an answer based on learning.</p><table><thead><tr><th>Fixed rules</th><th>Learning from examples</th></tr></thead><tbody><tr><td>Follows given instructions.</td><td>Finds useful '+T('pattern','patterns')+' in data.</td></tr><tr><td>If yellow, say mango.</td><td>Learn from many named fruit pictures.</td></tr></tbody></table><p><b>Example:</b> A computer learns to recognize mangoes from different labelled pictures.</p><p><b>Remember:</b> AI can make mistakes. Not every automatic machine uses AI.</p></section>';}

const chapterStories=[[["Aarav learns to cycle","Aarav borrows Kabir's bicycle and falls off balance on his first try. Kabir teaches Aarav to look ahead, pedal slowly and steer. After practising in the playground, Aarav can ride along a new path without help.","**Learning from experience** helps us solve new problems.","Why can Aarav ride along a new path?","Aarav has learned how to balance and steer rather than memorising one path. He can use those skills somewhere new."],["Meera visits the fruit market","Meera goes to a market in Sangli with Grandma Lata. Lata shows Meera a yellow mango and then a green mango. Meera notices their similar shape and recognises an orange mango the next week without asking Lata.","**Recognition** means identifying something using what we already know.","Why can Meera recognise the orange mango?","Meera remembers useful details such as shape from earlier examples. She does not rely on colour alone."],["Riya finds her classroom","Riya arrives at a new school. Teacher Anita explains that the library is next to the stairs and the classroom is opposite it. The next morning Riya uses those landmarks to reach the room by herself.","**Memory and understanding** help us make decisions.","Is Riya simply copying Anita's exact footsteps?","No. Riya understands where the landmarks are. She can use that information even if she starts from a different entrance."],["Dev repairs a toy car","Dev builds a toy car in the school ATL lab. A wheel keeps falling off, so Dev compares it with the other wheels and notices a missing washer. Mr Patil gives Dev a washer, and the car rolls properly after Dev fits it.","**Problem-solving** means finding a cause and trying a solution.","What shows Dev's intelligence?","Dev compares the wheels, identifies a likely cause and tests a solution. Intelligence is more than speed."],["Sana learns a word","Sana sees the word umbrella in a textbook. Teacher Neha shows a real umbrella and explains how it protects people from rain. When rain starts the next day, Sana asks for an umbrella without opening the book.","**Understanding** connects a word to its meaning and use.","Would reading umbrella very fast prove Sana understands it?","No. Sana demonstrates understanding by knowing what it is for and asking for it in the right situation."]],[["Isha and the mango tree","Isha waters a mango tree with Grandpa Mohan. Flowers appear and fruits grow over time. At a shop, Isha sees a plastic mango that looks similar but cannot grow or ripen.","**Natural** things occur in nature; **artificial** things are made by people.","Why is the plastic mango artificial?","People made the plastic mango to look like fruit. A natural mango is produced by a living tree."],["Kabir makes a paper flower","Kabir studies a fallen flower in the garden. In art class, teacher Pooja helps Kabir fold coloured paper into a flower. The paper flower looks bright, but it needs no sunlight or water.","Artificial things can imitate nature without being alive.","Does looking like a flower make it natural?","No. The paper flower is made by people. Its appearance does not change how it was produced."],["Ananya visits Grandpa Ramesh","Grandpa Ramesh has difficulty hearing quiet speech. Ananya learns how a hearing aid makes sounds easier to hear. Some modern hearing aids can also use trained models to help separate speech from background noise.","An **artificial tool** can support a natural human ability.","Is every hearing aid AI?","No. Basic hearing aids can amplify sound using ordinary electronics. Some newer ones use trained models to help separate speech from noise."],["Om builds a paper bird","Om watches sparrows fly near the playground. In the lab, Om folds a paper bird that glides when thrown. Unlike a sparrow, the paper model cannot choose where it goes or find food.","A human-made object can copy a natural shape or movement without intelligence.","Does Om's paper bird know where to fly?","No. Its movement depends on its shape, the throw and the air. It does not learn or decide where to go."],["Nisha tries a fruit app","Nisha wants to identify fruit using a phone. Engineer Priya builds a recognition app with a trained image model. When Nisha shows a mango photo, the app gives a likely name because people designed it to perform that task.","**Artificial intelligence** is human-made technology that performs tasks associated with intelligence.","Is every artificial object intelligent?","No. Chairs and plastic mangoes are artificial, but they do not learn or recognise images. AI is a particular kind of technology."]],[["Aditi unlocks her phone","Before school, Aditi looks at her phone instead of entering a passcode. An AI-based face recognition system compares facial features with information saved during setup. If the match is strong enough, the phone unlocks; in poor light Aditi may need her passcode.","**AI** can recognise patterns in images.","Does the phone think exactly like Aditi?","No. It performs a specific recognition task using a model and data. That does not mean it has Aditi's feelings or human understanding."],["Arjun talks to an assistant","Arjun has flour on his hands while helping Papa Vikram make rotis. Arjun says, “Set a timer for five minutes.” The phone recognises his spoken words, identifies the request and starts a timer. Arjun checks the displayed time.","**Speech recognition** converts spoken sounds into words.","Which part of the task uses AI?","A trained speech model can identify the words from sound. The timer itself can count down using ordinary instructions."],["Kavya finds Bruno's photo","Kavya wants to show a picture of her dog Bruno to a classmate. Kavya searches dog in a photo app with image search. The app finds likely dog pictures among hundreds of family photos, and Kavya chooses the correct one.","**Image recognition** can help find objects without manually naming each picture.","Why might the app show a wrong photo?","A model may confuse similar patterns or miss a partly hidden dog. Kavya must check the results."],["Rahul receives a suspicious message","Rahul gets an email claiming that he won a prize in a contest he never entered. An AI-based spam filter examines patterns in the message and flags it as suspicious. Rahul avoids the link and asks teacher Anil for help.","**Classification** means putting information into a group, such as likely spam or normal email.","Can Rahul trust every message that is not marked spam?","No. Filters can miss suspicious messages or wrongly flag normal ones. Rahul should still check unknown senders and links."],["Farah writes a number","Farah writes a number 7 in the computer lab. Teacher Farida shows an app trained on many handwriting examples. The app predicts 7 even though Farah's handwriting does not exactly match any training picture.","Many AI systems use **learned patterns** to make a **prediction**.","Why is a single rule about handwriting difficult to write?","People write numbers in different ways. Training on varied examples can help a model recognise useful similarities, although it can still make mistakes."]],[["Yash hears the school bell","At 8 o'clock Yash hears the school bell. Office assistant Sunil has set a timer with the school schedule. The timer checks the clock and rings at the chosen time every school day, without learning from examples.","A **fixed rule** tells a machine what to do when a condition is met.","Does the school bell need AI?","No. It follows a schedule. Being automatic is not enough to make a machine AI."],["Pihu sorts yellow fruit","Pihu tells Rohan to put every yellow fruit in the mango basket. The rule works for a yellow mango but fails when a green mango arrives. Rohan follows the instruction correctly even though the fruit is placed in the wrong basket.","A fixed rule can fail when real objects do not fit its condition.","Why did Rohan reject the green mango?","The instruction checked colour rather than fruit type. The rule was incomplete."],["Manav enters a shop","Manav enters a shop in Miraj. A simple motion sensor detects movement and opens the door. When nobody is nearby, the door closes. It does not need to know who Manav is.","**Automatic** means working by itself after setup; a simple sensor can do this without AI.","Is every automatic door AI?","No. A basic door follows a sensor rule. A different system that recognises faces may use AI."],["Leena uses a calculator","Leena enters 27 + 15 on a calculator in maths class. The screen displays 42. When Leena enters different numbers, the same arithmetic instructions work without collecting examples of sums.","Ordinary programs are useful for tasks with clear instructions.","Is the calculator AI because it is fast?","No. Basic addition follows arithmetic procedures. Speed alone does not prove intelligence."],["Vihaan compares two machines","Vihaan visits a fruit packing centre with Uncle Deepak. Machine A sorts only by yellow colour; Machine B uses a trained image model. A yellow apple confuses Machine A, while Machine B can consider shape as well as colour. Deepak checks the result.","A **fixed rule** checks a given condition; a trained model uses learned patterns.","Which machine may work better for varied fruit?","The trained model may handle different colours and shapes better. It still needs useful training data and testing."]],[["Tara collects fruit photos","Tara and Diya photograph mangoes and apples at a market. Some mangoes are green and some are yellow; apples can also have several colours. They save the photos in a folder for their classroom recognition project.","**Data** is information a computer can use, such as pictures.","Why collect different colours of each fruit?","Varied examples help a model learn that one type of fruit can look different. It is less likely to rely only on colour."],["Aditya labels the photos","Aditya writes mango or apple beneath each fruit photo. Teacher Shalini spots a mango incorrectly named apple and corrects it. Aditya checks the other photos before the class uses them to train a model.","A **label** is the correct name or answer attached to an example.","What if many mangoes are labelled apple?","The model receives misleading information and may learn the wrong connection. Correct labels matter."],["Zoya studies handwriting","Zoya asks Naman and Asha to write the numbers 0 to 9. They scan the numbers and add correct labels. Zoya notices that people draw a 4 differently, but the examples still have similarities.","A **pattern** is a repeated similarity; a **feature** is a detail.","Why collect handwriting from several people?","Varied handwriting helps a model recognise different styles. One person's writing may not represent everyone."],["Pranav records voices","Pranav records classmates saying hello and good morning with permission. Teacher Jyoti helps attach the correct words to the recordings. Pranav notices that classmates speak at different speeds and have different voices.","**Sound data** can help train speech recognition.","Can data be sound instead of pictures?","Yes. Sounds, pictures, words and numbers can all be data. A speech model learns useful patterns in sound."],["Maya compares leaves","Maya and gardener Suresh photograph healthy and damaged leaves in the school garden. Suresh helps label the photos while Maya notes spots and colour. Some healthy leaves are darker than others, so darkness alone does not show damage.","Useful **features** and accurate labels help a model learn patterns.","Does a dark green leaf always mean the plant is unhealthy?","No. One feature can be misleading. Other details and reliable labels can help distinguish groups."]],[["Neel teaches a digit model","Neel collects labelled handwriting with teacher Raj. A digit model uses the examples during training. When Neel shows a fresh number 5, the trained model predicts a digit and Raj checks the answer.","**Training** is learning from examples; a **model** is used after training.","How are training and testing different?","Training helps the model learn. Testing uses new examples to see whether learned patterns work."],["Anika learns about dogs","Mrs Desai shows Anika pictures of Bruno, a small dog, and Simba, a large dog. Anika sees dogs of different colours and shapes. At the park Anika recognises a dog that she has never seen before. Teacher Rekha uses this as an analogy for machine learning.","Learning useful similarities can help with new examples.","Why show Anika several different dogs?","Variety helps Anika notice shared features despite differences. Training models can also benefit from varied examples, though human and machine learning differ."],["Dhruv trains a fruit model","Dhruv labels yellow and green mangoes, and red and green apples. The classroom model stores their colour and shape features. When Dhruv tests an orange mango, the model compares those features and predicts mango.","A trained model can use **learned information** on a new input.","What should Dhruv do before claiming success?","Test more new fruits and check the predictions against their actual names. One correct prediction is not enough."],["Sara practises reading","Sara reads short sentences with tutor Alka every evening. After practice, Sara reads a new sentence containing familiar words. Alka explains that this is an analogy for using earlier learning in a new situation.","**Using what was learned** on new information is a goal of machine learning.","Does an AI learn exactly like Sara?","No. AI training uses mathematical processes and data. Human learning is much broader, so the comparison is only an analogy."],["Ibrahim tests a voice app","Ibrahim tries a trained speech app with teacher Ashok. Ibrahim speaks a sentence that was not in the training collection. The model produces written words, but a background fan causes one wrong word. Ibrahim corrects it.","A **prediction** is an answer based on information and learning, not a guarantee.","Can a trained model make a mistake?","Yes. Noise, unusual inputs or gaps in training may affect its prediction. Check important results."]],[["Aarohi starts the empty lab","Aarohi opens the fruit lab before adding examples. The lab asks for training data when Aarohi tries to test a fruit. Aarohi saves one correctly labelled mango, but the model still has no information about apples.","This classroom model needs **training examples** to compare.","Can this empty model recognise fruit reliably?","No. It has nothing saved to compare. A real app may already be trained, but this particular lab starts empty."],["Rudra corrects a label","Rudra sees a red apple in the fruit lab and accidentally selects mango. The lab asks Rudra to look again instead of saving the wrong label. Rudra selects apple, and the example enters the collection.","**Correct labels** give the model useful information.","Why does the lab ask Rudra to correct the label?","A wrong label would give misleading information. The lab checks labels to help students learn why accurate training data matters."],["Avni adds variety","Avni notices a yellow mango is already saved in the model. Avni adds a green mango and compares it with a green apple. Although the fruits share a colour, their shapes are different.","**Variety** helps show why more than one feature matters.","Why not train with yellow mangoes only?","Mangoes may be green or orange too. Varied data can help a model avoid depending on one colour."],["Krish tests a new mango","Krish finishes collecting four labelled fruits. Krish selects the orange mango from the test group. The lab compares its features with saved examples and predicts mango. Krish checks the actual fruit name.","A **test example** should be new to the training collection.","Why test new fruits rather than the same pictures?","New fruits help show whether the model uses learned information beyond the original examples."],["Mitali compares two answers","Mitali selects a yellow apple and enables comparison. The colour rule calls the apple mango, while the model with all four examples compares shape and colour and predicts apple. Mitali explains both results to the class.","The model uses multiple **features**; the colour rule checks only one.","Is AI always better than fixed rules?","No. For this particular fruit, the model does better. Fixed rules are excellent for clear tasks and models can still fail."]],[["Anvi trains on mangoes only","Anvi uses only mango examples in the classroom mistake experiment. When an apple is tested, the model calls it mango because all saved examples have that name. Anvi adds apples and tests again.","**Missing data** can cause a model to make a wrong prediction.","Why was the apple called mango?","The model only knew saved mango examples. It had not received information about the apple group."],["Parth checks his maths mark","Parth writes 7 on a worksheet. A handwriting recognition model reads it as 1. Teacher Vidya compares the prediction with Parth's paper and corrects the mark before returning the worksheet.","**Human checking** matters when an error affects someone's result.","Who should decide Parth's mark?","The teacher should check the original answer. The model's prediction is not proof that Parth wrote 1."],["Simran tries a noisy room","Simran asks a voice assistant to set a timer for five minutes while music plays. The phone sets fifteen minutes instead. Simran notices the error, stops the timer and repeats the request in a quiet room.","A model may struggle with unclear **input**.","How could Simran reduce the error?","Reduce noise, speak clearly and check the displayed result. Enter the timer manually if necessary."],["Aman checks a plant app","Aman photographs a spotted leaf in the school garden. A plant app suggests disease, but gardener Seema explains that insects can cause similar spots. Aman checks the plant with Seema before deciding what to do.","A model's **prediction** is a possible answer, not certainty.","Should Aman treat the plant based only on the app?","No. Similar symptoms may have different causes. Check with a knowledgeable person before acting."],["Roshni improves her examples","Roshni notices that a dog photo model misses dogs in dim light. With permission, Roshni and teacher Imran collect more varied and correctly labelled photos. They test again on fresh photos; some errors improve, but others remain.","**Better data** and testing can improve a model without guaranteeing perfection.","Does adding more examples fix every error?","No. Examples must be relevant and correct, and the model may still have limits. Testing shows whether performance improved."]],[["Aditi unlocks her phone","Aditi looks at her phone before school. A face recognition model compares features with information saved during setup. A strong match lets the phone unlock, but when lighting is poor Aditi uses the passcode instead.","**Input:** face image. **AI:** face comparison. **Result:** possible match.","Why is this different from pressing a button?","Face recognition can use learned visual patterns, while a button normally follows a fixed instruction. Not all face unlock systems work the same way."],["Arjun sets a kitchen timer","Arjun helps Papa Vikram make rotis. With flour on his hands, Arjun asks the phone for a five-minute timer. A speech model recognises the words and the assistant starts the timer. Arjun checks the displayed time.","**Input:** sound. **AI:** speech recognition. **Result:** words and an action.","Is the countdown AI?","No. The speech recognition can use AI, but the timer itself follows ordinary instructions."],["Kavya visits a fruit packing centre","Kavya visits Aunt Sunita at a packing centre. A camera photographs fruit and a trained model predicts the fruit type. The sorting equipment separates apples and mangoes based on those results. Sunita checks damaged or unusual fruits by hand.","**Input:** fruit image. **AI:** image recognition. **Result:** likely fruit name.","Why does Sunita still check fruit?","Poor lighting, damage or unusual shapes can confuse a model. Human checks help prevent incorrect sorting."],["Rahul reads an email","Rahul receives an email claiming a prize from a contest he never entered. An AI spam filter identifies suspicious patterns and moves the email into a spam folder. Rahul does not open the unknown link and asks teacher Anil for advice.","**Input:** email. **AI:** classification. **Result:** likely spam or normal email.","Are all emails left in the inbox safe?","No. A filter may miss unwanted emails and wrongly flag normal ones. Rahul should remain careful with unknown links."],["Farah searches for Bruno","Farah wants to show a photo of her dog Bruno to a classmate. Farah searches dog in a photo app with image search. The model finds likely dog photos even when no written labels were added. Farah selects the actual photo of Bruno.","**Input:** photos and search word. **AI:** image patterns. **Result:** possible matches.","Why might a dog photo be missed?","A dog might be partly hidden or photographed in poor light. A trained model may make a mistake, so a person checks the results."]],[["Riya explains intelligence","Riya shows Neel several mangoes in different colours. Neel notices their similar shapes and recognises a new mango. Riya writes in the notebook that experience can help people understand and solve new problems.","**Intelligence:** learning, understanding and solving problems.","How does Neel recognise a mango he has never seen before?","He uses similarities from earlier experience instead of needing an exact match."],["Kabir explains artificial intelligence","Kabir compares a paper bird with an app that recognises birds in pictures. Both are made by people, but the trained app performs a recognition task. Kabir writes the difference in his notebook.","**Artificial** means made by people; **AI** performs tasks associated with intelligence.","Why is a paper bird not AI?","It is artificial, but it does not recognise, learn or predict anything. Artificial does not automatically mean intelligent."],["Sana draws a data table","Sana draws fruit pictures in her notebook and writes their correct names. She marks each fruit's colour and shape. Teacher Neha explains that the pictures are data, the names are labels and the details are features.","**Data → labels → useful patterns.**","How are a label and a feature different?","A label gives the correct name, such as mango. A feature describes a detail, such as green colour or long shape."],["Dev explains training and testing","Dev teaches the classroom fruit model with four labelled examples. Dev tests an orange mango that was not in the original collection. The model predicts mango and Dev checks the actual fruit before writing down the result.","**Training → model → prediction → checking.**","Why use a new test example?","It helps show whether learned information works beyond the examples used during training."],["Meera compares a bell and an app","Meera draws a school bell and a fruit recognition app in her notebook. The bell follows a schedule; the app recognises fruit using learned patterns. Meera adds a warning that models can make wrong predictions.","**Fixed rules** and **AI** are different approaches; both can be useful.","What should Meera remember before trusting AI?","AI can make mistakes. Check important answers against reliable information and use human judgment."]]];
const safeStory=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const highlightStory=s=>safeStory(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');
function storyPanel(){
 const entries=chapterStories[page],d=entries[storyIndex];
 const choices=entries.map((a,i)=>'<button type="button" data-act="story" data-i="'+i+'" aria-pressed="'+(i===storyIndex)+'" '+(i===storyIndex?'class="selected"':'')+'><span class="mono">0'+(i+1)+'</span> '+safeStory(a[0])+'</button>').join('');
 const sentences=d[1].match(/[^.!?]+(?:[.!?]+|$)/g)||[d[1]];
 const name=d[0].split(' ')[0].replace(/'s$/,'');
 const narrative=sentences.map(x=>safeStory(x.trim()).replace(new RegExp('\\b'+name+'\\b','g'),'<strong>'+name+'</strong>')).join(' ');
 return '<div class="story-tabs" aria-label="Five story examples">'+choices+'</div><article class="reading-story"><div class="mono meta">STORY 0'+(storyIndex+1)+' / 05 · ILLUSTRATIVE REAL-WORLD SCENARIO</div><h3>'+safeStory(d[0])+'</h3><p>'+narrative+'</p><div class="story-key"><b>What this teaches us</b><p>'+highlightStory(d[2])+'</p></div></article>';
}
function chapterReading(){
 const entries=chapterStories[page];
 return '<section class="chapter-reading" aria-label="Chapter stories and discussion"><header class="reading-head"><div><div class="mono meta">READ · UNDERSTAND · DISCUSS</div><h2>5 real-world stories</h2><p>Choose a story. Read what happened and notice the important concept.</p></div></header><div id="story-panel">'+storyPanel()+'</div><section class="discussion"><div class="mono meta">CLASS DISCUSSION</div><h2>5 Think Together questions</h2><p>Discuss each question first. Open the answer when ready.</p>'+entries.map((d,i)=>'<details class="question-card"><summary><span class="q-number">0'+(i+1)+'</span><span>'+safeStory(d[3])+'</span><span class="q-reveal" aria-hidden="true">Answer</span></summary><div class="question-answer"><b>Answer explained</b><p>'+safeStory(d[4])+'</p></div></details>').join('')+'</section></section>';
}

function render(){stopMotion();let d=slides[page],s=d.steps[step];$('jump').innerHTML=slides.map((x,i)=>'<option value="'+i+'" '+(page===i?'selected':'')+'>'+String(i+1).padStart(2,'0')+' · '+x.short+'</option>').join('');$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('progress').textContent='Chapter '+(page+1)+' / '+slides.length;$main.innerHTML='<div class="mono meta">FIG. '+String(page+1).padStart(2,'0')+' / '+slides.length+' · SELF-PACED</div><h1>'+d.title+'</h1>'+(s?'<div class="steps" aria-label="Explanation steps">'+d.steps.map((a,i)=>'<button data-step="'+i+'" aria-current="'+(i===step)+'">'+a.h.split(' · ')[0]+' · '+(i+1)+'/'+d.steps.length+'</button>').join('')+'</div><div class="layout"><section class="panel copy"><div class="mono meta">EXPLANATION '+(step+1)+' / '+d.steps.length+'</div><h2>'+s.h+'</h2><p>'+s.p+'</p><div class="example"><b>Read and discuss:</b> Explore the five named-character stories after this illustration. Try the five Think Together questions before revealing the answers.</div><div class="controls">'+btn('replay','Replay animation',s.kind==='quiz'?'disabled title="Choose an answer in the quiz"':'')+btn('stepback','← Step',''+(step===0?'disabled':''))+btn('advance',step<d.steps.length-1?'Next explanation →':'Next slide →','class="primary"')+'</div></section><section class="panel stage" id="stage">'+stage(s)+'</section></div>':notes())+chapterReading();$main.scrollTop=0;mountMotion();}
function refresh(){stopMotion();let s=slides[page].steps[step];$('stage').innerHTML=stage(s);mountMotion()}function go(i){page=Math.max(0,Math.min(slides.length-1,i));step=0;storyIndex=0;lifeChoice=0;render()}function advance(){if(step<slides[page].steps.length-1){step++;render()}else go(page+1)}
function glossary(k){let a=terms[k];$('word').textContent=a[0];$('meaning').textContent=a[1];$('example').textContent='Example: '+a[2];$('wordart').innerHTML=scene(a[3],a[3]==='clock'?0:2);if(!$('gloss').open)$('gloss').showModal();}function dictionary(){$('word').textContent='Tap a word';$('wordart').innerHTML='<div class="dictionary">'+Object.keys(terms).map(k=>T(k)).join('')+'</div>';$('meaning').textContent='';$('example').textContent='';if(!$('gloss').open)$('gloss').showModal();}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.word){glossary(b.dataset.word);return}if(b.dataset.step!==undefined){step=Number(b.dataset.step);render();return}let i=Number(b.dataset.i);switch(b.dataset.act){case'story':storyIndex=i;lifeChoice=i;$('story-panel').innerHTML=storyPanel();if(page===8&&slides[page].steps[step].kind==='life')refresh();break;case'replay':case'motionrestart':replayMotion();break;case'motionpause':toggleMotion();break;case'motionspeed':speedMotion();break;case'stepback':if(step>0){step--;render()}break;case'advance':advance();break;case'reveal':{let a=$('answer');a.hidden=!a.hidden;b.setAttribute('aria-expanded',String(!a.hidden));b.textContent=a.hidden?'Reveal why':'Hide answer';if(!a.hidden)a.scrollIntoView({block:'nearest'});break}case'teach':{let j=trainingIds[training.length];if(j===undefined)break;if(F[j][1]!==['mango','apple'][i]){$('feedback').textContent='Not quite. Look at the fruit shape and choose its correct name.';break}training.push(j);refresh();$('feedback').textContent='Correct label saved! '+training.length+' / 4 examples.';break}case'reset':training=[];tested=null;refresh();break;case'backtrain':step=0;render();break;case'test':tested=i;refresh();break;case'resettest':tested=null;refresh();break;case'mistake':mistakeMode=step;refresh();break;case'clearMistake':mistakeMode=null;refresh();break;case'life':lifeChoice=i;storyIndex=i;refresh();if($('story-panel'))$('story-panel').innerHTML=storyPanel();break;case'quiz':quizChoice=i;refresh();break;case'quiznext':quizIndex=(quizIndex+1)%quizzes.length;quizChoice=null;refresh();break;}});
$('jump').onchange=e=>go(Number(e.target.value));$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('dictionary').onclick=dictionary;$('allwords').onclick=dictionary;$('close').onclick=()=>$('gloss').close();$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});};document.addEventListener('keydown',e=>{if($('gloss').open||['SELECT','BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1);if(e.key===' '){e.preventDefault();advance()}if(e.key==='/')location.href='../';});render();
</script></body></html>
