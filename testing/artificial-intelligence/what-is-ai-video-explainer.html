<script>
'use strict';const $=id=>document.getElementById(id);const terms={intelligence:['Intelligence','The ability to learn, understand and solve problems.','A child recognizes a green mango after seeing other mangoes.','human'],artificial:['Artificial','Made by people rather than produced by nature.','A plastic mango is artificial; a mango growing on a tree is natural.','natural'],AI:['Artificial Intelligence (AI)','Technology that allows computers to perform tasks that usually need human intelligence.','A computer identifies fruit in a picture.','machine'],computer:['Computer','A machine that follows instructions and works with information.','A phone is a small computer.','machine'],rule:['Fixed rule','An instruction that says exactly what to do.','If the fruit is yellow, call it a mango.','rule'],data:['Data','Information that a computer can use. It can be pictures, words, numbers or sounds.','Pictures of four fruits are data.','data'],label:['Label','The name or correct answer attached to an example.','A picture marked “mango” has a label.','label'],pattern:['Pattern','A feature or similarity that appears repeatedly.','Many mangoes have a similar oval shape even when colours differ.','pattern'],training:['Training','The process of learning from examples.','Showing a computer different named fruit pictures.','training'],model:['Model','The result of learning that a computer uses to make an answer.','A fruit recognizer that compares new fruit with learned examples.','machine'],prediction:['Prediction','An answer or guess based on information already learned.','The computer says “mango” when it sees a new fruit.','predict'],automatic:['Automatic','Something that works by itself after being set up.','A school bell rings at a set time without anyone pressing it.','clock'],feature:['Feature','A detail that helps describe something.','The colour and shape of a fruit are two features.','pattern']};
const T=(k,s=terms[k][0])=>'<button class="term" data-word="'+k+'">'+s+'</button>';const F=[['Yellow mango','mango','#edb72d',1,1],['Red apple','apple','#df5549',0,0],['Green mango','mango','#89af4d',0,1],['Green apple','apple','#89af4d',0,0],['Orange mango','mango','#ed9140',0,1],['Yellow apple','apple','#edb72d',1,0],['Dark green mango','mango','#4d8a3c',0,1]];
function fruit(i,x=0,y=0,s=1){let f=F[i];return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="'+(f[1]==='mango'?'M57 16 C94 18 94 64 59 91 C30 112 8 82 15 55 C21 31 39 15 57 16Z':'M50 31 C18 7 4 43 17 75 C28 102 43 97 50 91 C65 106 84 91 91 65 C100 32 74 14 50 31Z')+'" fill="'+f[2]+'" stroke="#383838" stroke-width="1.7"/><path d="M52 25 Q49 11 58 5" fill="none" stroke="#6c4b2e" stroke-width="5"/><path d="M55 14 Q74 0 87 11 Q74 25 55 14" fill="#528844"/><path d="M30 36 Q22 49 26 64" fill="none" stroke="#fff" stroke-opacity=".68" stroke-width="5" stroke-linecap="round"/></g>'}
const svg=(s,label='Illustration')=>'<svg class="scene" viewBox="0 0 660 260" role="img" aria-label="'+label+'">'+s+'</svg>';const text=(x,y,s,size=20,color='#111')=>'<text x="'+x+'" y="'+y+'" font-family="system-ui,sans-serif" font-size="'+size+'" text-anchor="middle" fill="'+color+'">'+s+'</text>';const box=(x,y,w,h,fill='#fff',stroke='#bbb')=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.5"/>';const arrow=(x,y,x2,y2)=>'<path d="M'+x+' '+y+' L'+x2+' '+y2+'" fill="none" stroke="#2563eb" stroke-width="3" class="trace"/><path d="M'+(x2-12)+' '+(y2-7)+' L'+x2+' '+y2+' L'+(x2-12)+' '+(y2+7)+'" fill="none" stroke="#2563eb" stroke-width="3"/>';const group=(s,c='fade')=>'<g class="'+c+'">'+s+'</g>';function computer(x,y,label='?',w=160){return '<g transform="translate('+x+' '+y+')">'+box(0,0,w,95,'#f0f5ff','#2563eb')+box(9,9,w-18,70,'#fff','#d3dff9')+text(w/2,53,label,21,'#1548a6')+'<path d="M'+w/2+' 95v18m-30 0h60" stroke="#111" stroke-width="3"/></g>'}function human(x,y){return '<g transform="translate('+x+' '+y+')"><circle cx="45" cy="40" r="31" fill="#e7b48b" stroke="#433b34"/><path d="M16 32 Q12 0 45 5 Q78 5 76 32 Q45 12 16 32" fill="#38312f"/><circle cx="34" cy="40" r="2.7"/><circle cx="57" cy="40" r="2.7"/><path d="M36 55q10 9 20 0" stroke="#593b2b" stroke-width="2" fill="none"/><path d="M5 128v-22q0-30 40-30t40 30v22" fill="#dde8ff" stroke="#2563eb" stroke-width="2"/></g>'}function picture(i,x,y,label=''){return box(x,y,122,130,'white','#c7c7c7')+fruit(i,x+20,y+3,.84)+(label?text(x+61,y+119,label,17):'')}
function scene(kind,n=0){let s='';if(kind==='human'){s=group(fruit(0,40,60,1.25),'travel')+human(268,55)+text(312,218,'Person');if(n>0)s+=arrow(165,120,260,120)+group(box(402,29,220,55,'#f0f5ff','#2563eb')+text(512,64,'A mango!',24));if(n>1)s+=group(fruit(2,484,100,1.2)+text(540,236,'Still a mango',20),'pulse');}
if(kind==='natural'){s=group('<path d="M135 165V75" stroke="#84613e" stroke-width="18"/><circle cx="135" cy="63" r="58" fill="#b6d89b"/>'+fruit(0,112,43,.45)+text(135,210,'Natural',23));if(n>0)s+=group(fruit(0,422,50,1.35)+text(485,210,'Made by people',23)+text(485,237,'Plastic mango',16),'fade delay');if(n>1)s+=group(text(325,118,'≠',42,'#e04836'));}
if(kind==='machine'){s=human(35,65)+fruit(0,175,72,.9)+text(80,226,'Human');if(n>0)s+=group(computer(410,68,n>1?'Mango!':'?',185)+text(502,226,'Computer'),'fade');if(n>1)s+=arrow(276,111,396,111)+group(text(332,78,'Picture',17,'#2563eb'),'fade delay');}
if(kind==='rule'){s=fruit(n===0?0:n===1?2:5,32,70,1.2)+arrow(158,120,222,120)+box(230,48,205,142,'#fff','#e04836')+text(332,80,'FIXED RULE',17,'#b33225')+text(332,115,'If yellow,',23)+text(332,148,'say mango.',23)+arrow(442,120,510,120)+group(box(515,78,135,84,n===0?'#f0f5ff':'#fff6f5',n===0?'#2563eb':'#e04836')+text(582,112,n===1?'Not mango':'Mango',19)+text(582,140,n===0?'Correct':'Wrong!',17,n===0?'#13733b':'#b33225'),'fade delay');}
if(kind==='data'||kind==='label'||kind==='pattern'){s=[0,1,2,3].map((i)=>group(picture(i,34+151*i,42,n>0?F[i][1]:''),i%2?'fade delay':'fade')).join('');if(n===0)s+=text(330,224,'Pictures = information',23,'#2563eb');if(n===1)s+=text(330,224,'Picture + correct name = labelled example',21,'#2563eb');if(n>1)s+=group('<path d="M95 185 Q95 216 245 216 M397 185 Q397 216 245 216" fill="none" stroke="#2563eb" stroke-width="3"/>'+text(330,246,'Similar shapes, different colours',20,'#2563eb'));}
if(kind==='training'){s=picture(0,12,60,'mango')+picture(1,146,60,'apple')+arrow(278,120,341,120)+computer(350,65,n===0?'Examples':n===1?'Compare':'Learned',160);if(n>0)s+=group(text(430,222,n===1?'Find similarities':'Ready to test',20),'fade delay');if(n>1)s+=arrow(520,115,554,115)+group(fruit(2,556,75,.85),'fade delay2');}
if(kind==='predict'){s=fruit(4,20,75,1.1)+arrow(135,120,222,120)+computer(232,68,n>0?'Compare':'?',175)+arrow(420,120,480,120)+group(box(490,69,155,100,'#f0f5ff','#2563eb')+text(567,110,n>0?'Mango':'?',23)+text(567,141,n>1?'Correct!':'Prediction',17),'fade delay');}
if(kind==='clock'){s='<circle cx="160" cy="116" r="77" fill="white" stroke="#555" stroke-width="3"/><path d="M160 116V64 M160 116l35 17" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>'+text(160,225,'School bell',22)+arrow(250,116,365,116)+group(box(380,61,242,110,'#fff','#e04836')+text(501,103,'10:00 → Ring',26)+text(501,139,'Fixed instruction',19));}return svg(s,kind+' illustration');}
const S=(h,p,e,kind,n,cap,ask,answer)=>({h,p,e,kind,n,cap,ask,answer});
const slides=[
{title:'How do people recognize things?',short:'Intelligence',time:3,steps:[S('Q01 · What is intelligence?','A person can learn, understand and solve problems. This ability is called '+T('intelligence')+'.','Recognizing a mango is a small example of intelligence.','human',0,'Look at the fruit. What is it?','How does a person know the fruit?','The person remembers what mangoes look like.'),S('Q02 · How does learning help?','People learn by seeing, hearing and practising. Remembered examples help with new situations.','A child sees several mangoes and remembers their shapes.','human',1,'See → remember → recognize','Does a child know every fruit from birth?','No. Children learn many names and patterns through experience.'),S('Q03 · Can two different fruits have the same name?','A green mango and a yellow mango look different, but both are mangoes. Intelligence helps recognize similarities.','Colour changes; the fruit is still a mango.','human',2,'Different colour. Same fruit.','Does intelligence mean simply being fast?','No. Speed alone is not the ability to learn or solve problems.')]},
{title:'Natural or artificial?',short:'Artificial',time:4,steps:[S('Q04 · What is natural?','Something produced by nature, rather than made by people, is natural.','A mango grows on a tree.','natural',0,'A real mango grows on a tree.','Is a mango tree a machine?','No. A mango tree is a living thing.'),S('Q05 · What is artificial?','Something made by people is called '+T('artificial')+'. It can look like something natural.','A plastic mango is made in a factory.','natural',1,'Real fruit and a man-made fruit','Does an artificial mango grow?','No. It was made by people.'),S('Q06 · Why use this word in AI?','Artificial intelligence is made by people. It is not the natural intelligence of a person or animal.','A computer can be built to recognize fruit.','natural',2,'Natural intelligence ≠ artificial intelligence','Is every artificial object intelligent?','No. A plastic mango is artificial, but it cannot recognize fruit or solve problems.')]},
{title:'What is artificial intelligence?',short:'AI',time:3,steps:[S('Q07 · What can a person do?','Recognizing objects, understanding words and solving problems are tasks that can require human intelligence.','A person sees a mango and says its name.','machine',0,'Human recognizes a mango.','Can a person recognize a fruit without a computer?','Yes. People use their own learned knowledge.'),S('Q08 · What is AI?',' '+T('AI')+' is technology that helps '+T('computer','computers')+' perform tasks that usually need human intelligence.','A computer recognizes a mango in a picture.','machine',1,'Can a machine do a similar task?','Does AI mean a robot with a human brain?','No. AI is a technology. It can work inside a phone or computer without a robot body.'),S('Q09 · Why make AI?','People make AI to help with tasks that can be difficult to describe using simple instructions. It can help recognize, sort or find information.','A fruit seller could use a computer to help sort fruit pictures.','machine',2,'A picture goes in. An answer comes out.','Does AI think and feel exactly like people?','No. It can perform certain tasks, but that does not mean it has human feelings or understanding.')]},
{title:'Instructions are not the same as learning',short:'Fixed rules',time:4,steps:[S('Q10 · What is a fixed rule?','A '+T('rule','fixed rule')+' is a written instruction. The machine follows it exactly, even if the instruction is incomplete.','IF yellow, THEN say “mango”.','rule',0,'Yellow mango → correct answer','Why did the machine say mango?','Because the instruction says to call every yellow fruit a mango.'),S('Q11 · What if the fruit is green?','The machine follows the same instruction. It does not know that some mangoes are green.','A green mango is called “not mango” by this rule.','rule',1,'Green mango → wrong answer','Can a fixed rule change by itself in this example?','No. A person would have to change the instruction.'),S('Q12 · What if a yellow fruit is an apple?','A yellow apple also matches the colour rule. Colour alone is not enough. Fixed rules are useful when the instructions are clear.','A school bell can ring at a fixed time. It is '+T('automatic','automatic')+', but does not need AI.','rule',2,'Yellow apple → wrong answer','Is every machine that works automatically AI?','No. A simple timer or fixed instruction can work '+T('automatic','automatically')+' without AI.')]},
{title:'What information does a computer need?',short:'Data',time:4,steps:[S('Q13 · What is data?',' '+T('data')+' is information that a computer can use. Pictures, words, sounds and numbers can all be data.','Four fruit pictures are four examples of picture data.','data',0,'Four pictures = four pieces of information','Is a voice recording also data?','Yes. Sound can be information a computer uses.'),S('Q14 · What is a label?','A '+T('label')+' is the correct name or answer attached to an example. It tells the computer what the picture represents.','The name “mango” beside a mango picture is its label.','label',1,'Picture + name = labelled example','What happens if a mango is labelled apple?','The computer receives misleading information and may learn the wrong answer.'),S('Q15 · What is a pattern?','A '+T('pattern')+' is a similarity that appears again and again. A '+T('feature')+' is a detail such as colour or shape.','Mangoes often have a similar shape even in different colours.','pattern',2,'Look beyond colour: compare shape','Which is more useful here: colour alone or colour and shape?','Colour and shape together can help distinguish these fruit examples.')]},
{title:'How can a machine learn?',short:'Learning',time:4,steps:[S('Q16 · Where does learning start?','Many AI systems start with examples. People collect information that can help the computer learn a task.','Show a yellow mango and a red apple with their names.','training',0,'Step 1 · Collect examples','Does an empty collection teach the computer fruit names?','No. This teaching model needs examples before it can make useful predictions.'),S('Q17 · What is training?',' '+T('training')+' is the process of learning from examples. Many AI systems find useful patterns in the data.','Compare the shapes and colours of named fruits.','training',1,'Step 2 · Learn from examples','Does learning always mean memorizing one picture?','No. Learning aims to find useful similarities so new examples can be recognized.'),S('Q18 · What happens after training?','A trained '+T('model')+' uses what it learned to answer a new question. Its answer is called a '+T('prediction')+'.','Show a mango picture that was not used for teaching.','training',2,'Step 3 · Use what was learned','Can the model answer perfectly every time?','No. A prediction may be right or wrong.')]},
{title:'Build a tiny fruit recognizer',short:'Experiment',time:5,steps:[S('Q19 · Teach by showing examples','Choose the correct label for each fruit. The small model stores its colour and shape with the name.','Start with a yellow mango. Then add different fruits.','lab',0,'Add examples to the collection','Why add more than one mango?','Mangoes can have different colours. More varied examples help the model compare them.'),S('Q20 · Test a new fruit','Choose a fruit that was not in the training collection. The model compares its colour and shape with the stored examples.','A new orange mango or yellow apple is a test example.','lab',1,'Test → compare → predict','Why test with new examples?','Testing new examples checks whether learning is useful beyond the pictures already shown.'),S('Q21 · Compare the two approaches','The fixed rule checks only yellow colour. The trained model compares the new fruit with labelled examples.','A yellow apple can fool the rule but not a well-taught fruit model.','lab',2,'Same fruit · two different approaches','Which approach worked better for this fruit?','Check both answers. The trained model can use shape as well as colour, but can still be wrong.')]},
{title:'AI can make mistakes',short:'Mistakes',time:5,steps:[S('Q22 · What if examples are missing?','A model trained only with mangoes has no apple examples to compare. It may call every fruit a mango.','Try a yellow apple after teaching only mangoes.','mistake',0,'Incomplete examples → possible wrong answer','Why was the answer wrong?','The teaching examples did not include apples.'),S('Q23 · How can learning improve?','Provide more useful, varied and correctly labelled examples. Then test again.','Add red and green apples as well as green and yellow mangoes.','mistake',1,'Add better examples and test again','Does adding examples guarantee a perfect AI?','No. Better examples can help, but real AI can still make mistakes.'),S('Q24 · Should every AI answer be trusted?','AI can help people, but its answers need checking, especially when the answer matters.','A person checks whether the computer put fruit in the correct group.','predict',2,'Prediction → check the actual answer','Who should check an important AI answer?','A person should check important answers against reliable information.')]},

$f('filmOpen').onclick=show;$f('filmClose').onclick=close;$f('filmLesson').onclick=close;dialog.addEventListener('close',()=>audio.pause());dialog.addEventListener('cancel',()=>audio.pause());['play','pause','ended','seeked','loadedmetadata'].forEach(e=>audio.addEventListener(e,sync));
